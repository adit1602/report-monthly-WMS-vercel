}
function wireTrxDetailTabs() {
  const bar = document.getElementById('trxDetailSel');
  if (!bar) return;
  const show = key => {
    trxDetailTab = key;
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === key));
    document.querySelectorAll('.trx-pane').forEach(el => { el.style.display = el.dataset.pane === key ? 'block' : 'none'; });
    const pane = trxDetailPanes.find(x => x.key === key);
    if (pane) pane.draw();
  };
  bar.addEventListener('click', e => { const btn = e.target.closest('button[data-val]'); if (btn) show(btn.dataset.val); });
  show(trxDetailTab);
}

/* Tabel harian per business process (group kolom dinamis). groupNames null = semua group; keys = batasi kolom (null = semua kolom). */
function trxDailyTableHtml(groupNames, keys, maxHeight) {
  const t = D.transaction;
  const groups = (t.detailGroups || []).filter(g => !groupNames || groupNames.includes(g.process))
    .map(g => {
      const cols = g.detailColumns.filter(c => !keys || keys.includes(c.key));
      return { process: g.process, cols, fmts: Object.fromEntries(cols.filter(c => c.fmt).map(c => [c.key, c.fmt])) };
    });
  if (!groups.length) return '';
  const rows = t.dailyDetail.filter(r => groups.some(g => r.processes[g.process]));
  const cell = (v, fmt) => v == null ? '<span style="color:var(--txt3)">&ndash;</span>' : fmt === 'rp' ? 'Rp ' + fmtRp(v) : fmt === 'pct' ? v.toFixed(2) + '%' : fmtN(v);
  let h = `<div class="card" style="padding:0"><div class="scroll-tbl tw" style="max-height:${maxHeight || 480}px"><table class="detail-tbl"><thead>
    <tr><th class="datecell" rowspan="2">Date</th>${groups.map(g => `<th class="grp" colspan="${g.cols.length}">${g.process}</th>`).join('')}</tr>
    <tr>${groups.map(g => g.cols.map(c => `<th class="n">${c.label}</th>`).join('')).join('')}</tr>
    </thead><tbody>`;
  rows.forEach(row => {
    h += `<tr><td class="datecell mono">${row.date}</td>`;
    groups.forEach(g => { const p = row.processes[g.process] || {}; g.cols.forEach(c => { h += `<td class="n" style="white-space:nowrap">${cell(p[c.key], g.fmts[c.key])}</td>`; }); });
    h += `</tr>`;
  });
  return h + `</tbody></table></div></div>`;
}

function renderTransaction() {
  const t = D.transaction;
  if (!t || !t.summaryCards) { document.getElementById('p-transaction').innerHTML = '<div class="empty">Data Transaction belum tersedia.</div>'; return; }
  const c = t.summaryCards;

  let h = `<div class="sec-head"><span class="eyebrow">Transaction</span><h2>Transaction Performance</h2><span class="hint">${t.meta ? t.meta.period : ''}</span></div>`;

  // 1. Summary Cards
  h += `<div class="kpi-row">`
    + kpiCard('server', 'Total Record', fmtN(c.totalRecord), '', 'neutral')
    + kpiCard('cpu', 'Total Complete Order', fmtN(c.totalSuccess), '', 'green')
    + kpiCard('disk', 'Total Discarded', fmtN(c.totalError), '', STATUS_3TIER[c.errorRateStatus] || 'neutral')
    + kpiCard('peak', 'Complete Rate', c.successRate, '%', STATUS_3TIER[c.successRateStatus] || 'neutral')
    + kpiCard('memory', 'Total Amount Complete Order', 'Rp ' + fmtRp(c.totalAmountSuccess), '', 'neutral')
    + kpiCard('memory', 'Total Amount Discarded', 'Rp ' + fmtRp(c.totalAmountError), '', 'neutral')
    + kpiCard('activity', 'Nasabah Unik', c.uniqueCif != null ? fmtN(c.uniqueCif) : '-', '', 'neutral')
    + `</div>`;

  // 2. Transaction Summary (+ baris Total)
  h += `<div class="sec-head"><span class="eyebrow">Ringkasan</span><h2>Transaction Summary</h2><span class="hint">${t.summary.length} business process</span></div>`;
  h += `<div class="card"><div class="tw"><table><thead><tr><th style="white-space:nowrap">Business<br>Process</th><th class="n" style="white-space:nowrap">Total<br>Record</th><th class="n" style="white-space:nowrap">%<br>Record</th><th class="n" style="white-space:nowrap">Complete<br>Order</th><th class="n" style="white-space:nowrap">Discarded</th><th class="n" style="white-space:nowrap">Complete<br>Rate</th><th class="n" style="white-space:nowrap">Amount<br>Complete Order</th><th class="n" style="white-space:nowrap">Amount<br>Discarded</th><th class="n" style="white-space:nowrap">Total<br>Volume</th><th class="n" style="white-space:nowrap">Nasabah<br>Unik</th><th>Note</th></tr></thead><tbody>`;
  const nw = 'style="white-space:nowrap"', rpn = v => v == null ? '<span style="color:var(--txt3)">&ndash;</span>' : 'Rp ' + fmtRp(v);
  t.summary.forEach(r => {
    const succSm = STATUS_META[STATUS_3TIER[r.successRateStatus]] || { cls: 'b-mut' };
    const totalAmount = (r.totalAmountSuccess != null || r.totalAmountError != null)
      ? (r.totalAmountSuccess || 0) + (r.totalAmountError || 0) : null;
    h += `<tr><td>${r.process}</td><td class="n">${fmtN(r.totalRecord)}</td><td class="n">${(r.totalRecord / c.totalRecord * 100).toFixed(1)}%</td>
      <td class="n">${fmtN(r.successRecord)}</td><td class="n" style="color:${r.errorRecord ? 'var(--red)' : 'inherit'}">${fmtN(r.errorRecord)}</td>
      <td class="n"><span class="badge ${succSm.cls}">${r.successRate}%</span></td>
      <td class="n" ${nw}>${rpn(r.totalAmountSuccess)}</td><td class="n" ${nw}>${rpn(r.totalAmountError)}</td><td class="n" ${nw}>${rpn(totalAmount)}</td>
      <td class="n">${r.uniqueCif != null ? fmtN(r.uniqueCif) : '&ndash;'}</td>
      <td style="color:var(--txt2);font-size:12px">${r.note}</td></tr>`;
  });
  const cardSm = STATUS_META[STATUS_3TIER[c.successRateStatus]] || { cls: 'b-mut' };
  h += `<tr style="font-weight:700;border-top:2px solid var(--line)"><td>Total</td><td class="n">${fmtN(c.totalRecord)}</td><td class="n">100%</td>
      <td class="n">${fmtN(c.totalSuccess)}</td><td class="n" style="color:${c.totalError ? 'var(--red)' : 'inherit'}">${fmtN(c.totalError)}</td>
      <td class="n"><span class="badge ${cardSm.cls}">${c.successRate}%</span></td>
      <td class="n" ${nw}>${rpn(c.totalAmountSuccess)}</td><td class="n" ${nw}>${rpn(c.totalAmountError)}</td><td class="n" ${nw}>${rpn((c.totalAmountSuccess || 0) + (c.totalAmountError || 0))}</td>
      <td class="n">${c.uniqueCif != null ? fmtN(c.uniqueCif) : '&ndash;'}</td><td style="color:var(--txt2);font-size:12px;font-weight:400">Nasabah unik gabungan (tanpa dobel antar proses). Volume = total nominal transaksi, bukan saldo.</td></tr>`;
  h += `</tbody></table></div></div>`;

  // 2b. Nasabah lintas produk
  const cp = t.crossProduct;
  if (cp && cp.customers) {
    h += `<div class="sec-head"><span class="eyebrow">Nasabah</span><h2>Nasabah Lintas Produk</h2><span class="hint">${fmtN(cp.customers)} nasabah dengan transaksi Complete Order</span></div>`;
    h += `<div class="kpi-row k4">` + cp.distribution.map((x, i) => kpiCard('activity', x.products === 1 ? 'Hanya 1 Produk' : `${x.products} Produk`, fmtN(x.customers), ` (${x.pct}%)`, i === 0 ? 'neutral' : 'green')).join('') + `</div>`;
    h += cycTable('<th>Produk</th><th class="n">Nasabah</th><th class="n">Juga di produk lain</th><th class="n">% Lintas Produk</th>',
      cp.byProduct.map(x => `<tr><td>${x.name}</td><td class="n">${fmtN(x.customers)}</td><td class="n">${fmtN(x.shared)}</td><td class="n">${x.sharedPct}%</td></tr>`), 'Tidak ada data.');
    h += cycTable('<th>Kombinasi Produk</th><th class="n">Nasabah di Keduanya</th>',
      cp.pairs.map(x => `<tr><td>${x.a} &amp; ${x.b}</td><td class="n">${fmtN(x.customers)}</td></tr>`), 'Tidak ada data.');
  }

  // 3-5. Chart sections (dual selector)
  h += trxSectionHtml({ key: 'byprocess', eyebrow: 'Per Business Process', title: 'Daily Trend by Business Process', hint: 'pilih business process dan metrik', dataArr: t.businessProcessTrend, useFullDates: true });

  // 6. Detail Daily Transaction -- ringkas (kolom lengkap ada di tab produk masing-masing)
  h += `<div class="sec-head"><span class="eyebrow">Detail</span><h2>Detail Daily Transaction</h2><span class="hint">ringkas per business process &middot; kolom lengkap ada di Detail per Produk</span></div>`;
  h += trxDailyTableHtml(null, ['totalRecord', 'successRate', 'totalAmountSuccess']);
  h += `<div class="note" style="margin:-4px 0 16px"><b>Complete Order</b> = status Done (Reksadana, Obligasi Sekunder) atau Completed Order (Obligasi Primer). <b>Discarded</b> = transaksi dengan status selain itu (Reksadana dan Sekunder: Discarded, Reversed, dst.; Primer: Unpaid Order / belum dibayar), bukan error sistem. Amount = nominal transaksi tersebut.</div>`;
  h += trxDetailTabsHtml();

  document.getElementById('p-transaction').innerHTML = h;

  wireTrxDetailTabs();
  drawTrxChart('byprocess', true);
  wireTrxSelectors('byprocess', true);
}

/* ====== HEADER, NAV, BOOT ====== */
function fillHero() {
  document.getElementById('hdrPeriod').textContent = D.meta.period;
  const by = D.meta.generated_by ? (' oleh ' + D.meta.generated_by) : '';
  document.getElementById('auditLine').innerHTML =
    'Periode ' + D.meta.period + '<br>Dibuat ' + D.meta.generated_at + by;
  renderPeriodSelector();
}
// Dropdown navigasi antar-periode: hanya muncul kalau ada >=2 report yang
// tercatat di reportsIndex (lihat build_report.py). Absen/kosong -> no-op,
// tampilan sama persis seperti sebelum fitur ini ada.
function renderPeriodSelector() {
  const list = D.reportsIndex;
  const sel = document.getElementById('periodSelector');
  if (!list || list.length < 2 || !sel) return;
  const baseHref = D.reportsBaseHref || '';
  const current = location.pathname.split('/').pop();
  list.forEach(r => {
    const opt = document.createElement('option');
    opt.value = baseHref + r.file;
    opt.textContent = r.period;
    // r.file bisa "2026-06/report-....html" (mode folder-per-bulan) ATAU
    // "report-....html" (mode lama/flat) -- bandingkan nama filenya saja.
    if (r.file.split('/').pop() === current) opt.selected = true;
    sel.appendChild(opt);
  });
  document.getElementById('hdrPeriod').style.display = 'none';
  sel.style.display = '';
  sel.addEventListener('change', () => { location.href = sel.value; });
}
/* ============ API (log API Top Up -- api_topup.py): response time, error code/message, success vs error ============ */
const apiSelected = {};
/* Service Performance (tab API): grafik per service dari log API. Judul = nama service, api = nama API di data. */
const SVC_PERF = [
  { api: 'TOPUP API', title: 'Service Topup & Subscription Reksadana Performance' },
  { api: 'MF RDMPT API', title: 'Service Redemption Reksadana Performance' },
  { api: 'SBN SEC BOOK API', title: 'Service Pemesanan SBN Retail Performance' },
];
let svcTpsSel = 0;
function svcServices() { const l = (D.api && D.api.apis) || []; return SVC_PERF.map(x => ({ ...x, a: l.find(y => y.name === x.api) })).filter(x => x.a); }
function svcPerfHtml() {
  const sv = svcServices();
  if (!sv.length) return '';
  let h = cycSec('Service', 'Service Performance', 'jumlah request per hari (Success / Error Bisnis / Error Teknis) dan response time rata-rata (ms)');
  sv.forEach((x, i) => { h += `<div class="card"><div style="font-weight:700;margin:0 0 6px">${x.title}</div>${chartScrollWrap('svcPerf' + i, 300, x.a.daily.length)}</div>`; });
  h += cycSec('Service', 'Summary Response & TPS Transaction', 'batang = TPS maksimum per hari &middot; garis = response time (ms)');
  h += `<div class="card trend-card"><div class="hostsel" id="svcTpsSel">${sv.map((x, i) => `<button class="${i === svcTpsSel ? 'on' : ''}" data-val="${i}">${x.api}</button>`).join('')}</div>${chartScrollWrap('svcTps', 320, sv[svcTpsSel] ? sv[svcTpsSel].a.daily.length : 0)}
    <div class="note" style="margin-top:8px">TPS = jumlah request terbanyak dalam 1 detik pada hari tersebut. Log hanya mencatat waktu per detik, jadi response time min/max kelipatan 1.000 ms dan rata-rata dihitung dari selisih detik tersebut.</div></div>`;
  return h;
}
function drawSvcPerf() {
  const sv = svcServices(), ms = v => v == null ? null : Math.round(v * 1000);
  const base = { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom' } } };
  sv.forEach((x, i) => {
    const dl = x.a.daily;
    mkChart('svcPerf' + i, { data: {
        labels: dl.map(d => fmtDateShort(d.date)),
        datasets: [
          { type: 'bar', label: 'Success', data: dl.map(d => d.S), backgroundColor: '#4472c4', yAxisID: 'y', order: 2 },
          { type: 'bar', label: 'Error Bisnis', data: dl.map(d => d.EB), backgroundColor: '#ed7d31', yAxisID: 'y', order: 2 },
          { type: 'bar', label: 'Error Teknis', data: dl.map(d => d.ET), backgroundColor: '#dc2626', yAxisID: 'y', order: 2 },
          { type: 'line', label: 'Response Time (ms)', data: dl.map(d => ms(d.rtAvg)), borderColor: '#a5a5a5', backgroundColor: '#a5a5a5', borderWidth: 3, tension: .25, pointRadius: 0, yAxisID: 'y2', order: 1 }] },
      options: { ...base, scales: { x: { ...gridXAllDates, stacked: true }, y: { ...gridY, stacked: true, ticks: { precision: 0 }, title: { display: true, text: 'Jumlah' } },
        y2: { position: 'right', grid: { drawOnChartArea: false }, beginAtZero: true, title: { display: true, text: 'ms' } } } } });
  });
  drawSvcTps();
}
function drawSvcTps() {
  const sv = svcServices(), x = sv[svcTpsSel];
  if (!x || !document.getElementById('svcTps')) return;
  const dl = x.a.daily, ms = v => v == null ? null : Math.round(v * 1000);
  mkChart('svcTps', { data: {
      labels: dl.map(d => fmtDateShort(d.date)),
      datasets: [
        { type: 'bar', label: 'Max TPS', data: dl.map(d => d.maxTps), backgroundColor: '#ed7d31', yAxisID: 'y2', order: 2 },
        { type: 'line', label: 'Max Response Time (ms)', data: dl.map(d => ms(d.rtMax)), borderColor: '#a5a5a5', backgroundColor: '#a5a5a5', borderWidth: 2, tension: .2, pointRadius: 0, yAxisID: 'y', order: 1 },
        { type: 'line', label: 'Min Response Time (ms)', data: dl.map(d => ms(d.rtMin)), borderColor: '#ffc000', backgroundColor: '#ffc000', borderWidth: 2, tension: .2, pointRadius: 0, yAxisID: 'y', order: 1 },
        { type: 'line', label: 'Average Response Time (ms)', data: dl.map(d => ms(d.rtAvg)), borderColor: '#4472c4', backgroundColor: '#4472c4', borderWidth: 3, tension: .2, pointRadius: 0, yAxisID: 'y', order: 0 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom' } },
      scales: { x: gridXAllDates, y: { ...gridY, beginAtZero: true, title: { display: true, text: 'Millisecond (ms)' } },
        y2: { position: 'right', grid: { drawOnChartArea: false }, beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: 'TPS' } } } } });
}
function renderAPI() { renderApiTab('apis', 'p-api', 'api', 'API Summary'); renderApiTab('inquiry', 'p-inquiry', 'inq', 'API Inquiry Summary'); }
function renderApiTab(key, pageId, pre, title) {
  const list = (D.api && D.api[key]) || [], el = document.getElementById(pageId);
  if (!list.length) { el.innerHTML = '<div class="empty">Data API belum tersedia (butuh file log API .xlsx di folder csv bulan ini).</div>'; return; }
  if (!list.some(x => x.name === apiSelected[key])) apiSelected[key] = list[0].name;
  const a = list.find(x => x.name === apiSelected[key]);
  const sec = v => v == null ? '&mdash;' : v + ' s';
  let h = cycSec('API', title, `${list.length} API &middot; ${a.meta.period}`);

  h += `<div class="card"><div class="tw"><table><thead><tr><th>API</th><th class="n">Total Request</th><th class="n">Success (200)</th><th class="n">Error Bisnis</th><th class="n">Error Teknis</th><th class="n">Success Rate</th><th class="n">Resp. Median</th><th class="n">Resp. P95</th><th class="n">Resp. Max</th><th class="n">Resp. Rata-rata</th></tr></thead><tbody>`
    + list.map(x => `<tr><td><span class="code">${x.name}</span></td><td class="n">${fmtN(x.kpi.total)}</td><td class="n">${fmtN(x.kpi.success)}</td><td class="n" style="color:${x.kpi.errBiz ? 'var(--yellow, #d97706)' : 'inherit'}">${fmtN(x.kpi.errBiz)}</td><td class="n" style="color:${x.kpi.errTech ? 'var(--red)' : 'inherit'}">${fmtN(x.kpi.errTech)}</td><td class="n">${x.kpi.successRate}%</td><td class="n">${sec(x.kpi.rtMed)}</td><td class="n">${sec(x.kpi.rtP95)}</td><td class="n">${sec(x.kpi.rtMax)}</td><td class="n">${sec(x.kpi.rtAvg)}</td></tr>`).join('')
    + `</tbody></table></div></div>`;
  h += `<div class="note" style="margin:-4px 0 16px"><b>Response time</b> = selisih waktu log response dan request yang dipasangkan, resolusi 1 detik sesuai log. <b>Success</b> = errCode 200 (atau response tanpa kode error); selain itu dihitung error. <b>Error teknis</b> = error code &ge; 500; di bawah 500 (selain 200) = <b>error bisnis</b>. <b>Success Rate</b> = (Success + Error Bisnis &minus; Error Teknis) &divide; Total Request &times; 100%.</div>`;

  h += cycSec('Error', 'Error Code &amp; Message', `${fmtN(a.kpi.total)} request &middot; ${a.codes.length} jenis response`);
  h += `<div class="filterbar" style="margin-bottom:14px"><div class="fitem"><label>API</label><select id="${pre}Select">${list.map(x => `<option value="${x.name}" ${x.name === apiSelected[key] ? 'selected' : ''}>${x.name}</option>`).join('')}</select></div></div>`;
  const multi = (a.meta.services || []).length > 1;
  h += `<div class="card"><div class="tw"><table><thead><tr><th>No</th>${multi ? '<th>Endpoint</th>' : ''}<th>Error Code</th><th>Jenis</th><th>Error Message</th><th class="n">Jumlah</th><th class="n">Percentage</th><th class="n">Resp. Median</th></tr></thead><tbody>`
    + a.codes.map((c, i) => `<tr><td>${i + 1}</td>${multi ? `<td><span class="code">${c.service || '-'}</span></td>` : ''}<td>${c.code == null ? '-' : `<span class="code">${c.code}</span>`}</td><td>${{ok: 'Success', biz: 'Bisnis', tech: 'Teknis'}[c.kind] || '-'}</td><td>${c.message}${c.ok ? ' <span class="badge b-ok" style="font-size:10px">SUCCESS</span>' : ''}</td><td class="n">${fmtN(c.count)}</td><td class="n">${c.pct.toFixed(2)}%</td><td class="n">${sec(c.rtMed)}</td></tr>`).join('')
    + `</tbody></table></div></div>`;

  h += cycSec('Volume', `Volume Request per Hari &mdash; ${a.name}`, 'batang = jumlah request &middot; garis = response time rata-rata (detik)');
  h += `<div class="card">${chartScrollWrap(pre + 'Daily', 320, a.daily.length)}</div>`;

  if (key === 'apis') h += svcPerfHtml();
  el.innerHTML = h;
  if (key === 'apis') {
    drawSvcPerf();
    const tb = document.getElementById('svcTpsSel');
    if (tb) tb.addEventListener('click', e => {
      const btn = e.target.closest('button[data-val]');
      if (!btn) return;
      svcTpsSel = +btn.dataset.val;
      tb.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      drawSvcTps();
    });
  }
  mkChart(pre + 'Daily', { data: {
      labels: a.daily.map(d => fmtDateShort(d.date)),
      datasets: [
        { type: 'bar', label: 'Success', data: a.daily.map(d => d.S), backgroundColor: '#5b9bd5', yAxisID: 'y', order: 2 },
        { type: 'bar', label: 'Error Bisnis', data: a.daily.map(d => d.EB), backgroundColor: '#ed7d31', yAxisID: 'y', order: 2 },
        { type: 'bar', label: 'Error Teknis', data: a.daily.map(d => d.ET), backgroundColor: '#dc2626', yAxisID: 'y', order: 2 },
        { type: 'line', label: 'Resp. rata-rata (s)', data: a.daily.map(d => d.rtAvg), borderColor: '#ffc000', backgroundColor: '#ffc000', borderWidth: 3, tension: .3, pointRadius: 0, yAxisID: 'y2', order: 1 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ...gridXAllDates, stacked: true }, y: { ...gridY, stacked: true, ticks: { precision: 0 }, title: { display: true, text: 'Jumlah' } },
        y2: { position: 'right', grid: { drawOnChartArea: false }, beginAtZero: true, ticks: { callback: v => v + 's' } } },
      plugins: { legend: { position: 'top' } } } });
  const sel = document.getElementById(pre + 'Select');
  if (sel) sel.addEventListener('change', () => { apiSelected[key] = sel.value; renderApiTab(key, pageId, pre, title); });
}
