}
function wireTrxDetailTabs() {
  const bar = document.getElementById('trxDetailSel');
  if (!bar) return;
  const show = key => {
    trxDetailTab = key;
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === key));
    document.querySelectorAll('.trx-pane').forEach(el => { el.style.display = el.dataset.pane === key ? 'block' : 'none'; });
    const pane = trxDetailPanes.find(x => x.key === key);
    if (pane) pane.draw();
  };
  bar.addEventListener('click', e => { const btn = e.target.closest('button[data-val]'); if (btn) show(btn.dataset.val); });
  show(trxDetailTab);
}

/* Tabel harian per business process (group kolom dinamis). groupNames null = semua group; keys = batasi kolom (null = semua kolom). */
function trxDailyTableHtml(groupNames, keys, maxHeight) {
  const t = D.transaction;
  const groups = (t.detailGroups || []).filter(g => !groupNames || groupNames.includes(g.process))
    .map(g => {
      const cols = g.detailColumns.filter(c => !keys || keys.includes(c.key));
      return { process: g.process, cols, fmts: Object.fromEntries(cols.filter(c => c.fmt).map(c => [c.key, c.fmt])) };
    });
  if (!groups.length) return '';
  const rows = t.dailyDetail.filter(r => groups.some(g => r.processes[g.process]));
  const cell = (v, fmt) => v == null ? '<span style="color:var(--txt3)">&ndash;</span>' : fmt === 'rp' ? 'Rp ' + fmtRp(v) : fmt === 'pct' ? v.toFixed(2) + '%' : fmtN(v);
  let h = `<div class="card" style="padding:0"><div class="scroll-tbl tw" style="max-height:${maxHeight || 480}px"><table class="detail-tbl"><thead>
    <tr><th class="datecell" rowspan="2">Date</th>${groups.map(g => `<th class="grp" colspan="${g.cols.length}">${g.process}</th>`).join('')}</tr>
    <tr>${groups.map(g => g.cols.map(c => `<th class="n">${c.label}</th>`).join('')).join('')}</tr>
    </thead><tbody>`;
  rows.forEach(row => {
    h += `<tr><td class="datecell mono">${row.date}</td>`;
    groups.forEach(g => { const p = row.processes[g.process] || {}; g.cols.forEach(c => { h += `<td class="n" style="white-space:nowrap">${cell(p[c.key], g.fmts[c.key])}</td>`; }); });
    h += `</tr>`;
  });
  return h + `</tbody></table></div></div>`;
}

  document.getElementById('p-transaction').innerHTML = h;

const apiSelected = {};

      const btn = e.target.closest('button[data-val]');
      if (!btn) return;
      svcTpsSel = +btn.dataset.val;
      tb.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      drawSvcTps();
    });
  }
  mkChart(pre + 'Daily', { data: {
      labels: a.daily.map(d => fmtDateShort(d.date)),
      datasets: [
        { type: 'bar', label: 'Success', data: a.daily.map(d => d.S), backgroundColor: '#5b9bd5', yAxisID: 'y', order: 2 },
        { type: 'bar', label: 'Error Bisnis', data: a.daily.map(d => d.EB), backgroundColor: '#ed7d31', yAxisID: 'y', order: 2 },
        { type: 'bar', label: 'Error Teknis', data: a.daily.map(d => d.ET), backgroundColor: '#dc2626', yAxisID: 'y', order: 2 },
        { type: 'line', label: 'Resp. rata-rata (s)', data: a.daily.map(d => d.rtAvg), borderColor: '#ffc000', backgroundColor: '#ffc000', borderWidth: 3, tension: .3, pointRadius: 0, yAxisID: 'y2', order: 1 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ...gridXAllDates, stacked: true }, y: { ...gridY, stacked: true, ticks: { precision: 0 }, title: { display: true, text: 'Jumlah' } },
        y2: { position: 'right', grid: { drawOnChartArea: false }, beginAtZero: true, ticks: { callback: v => v + 's' } } },
      plugins: { legend: { position: 'top' } } } });
  const sel = document.getElementById(pre + 'Select');
  if (sel) sel.addEventListener('change', () => { apiSelected[key] = sel.value; renderApiTab(key, pageId, pre, title); });
}

function renderAll() { fillHero(); renderExecutive(); renderInfra();
  renderEOD();
  renderOpJob();
  renderTransaction();
  renderAPI();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); t.classList.add('on');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on')); document.getElementById('p-' + t.dataset.p).classList.add('on');
});
window.__renderForPdf = function () { document.body.classList.add('print-all'); renderAll(); window.__PDF_DONE__ = true; };
renderAll();
window.__READY__ = true;
</script>
</body>
