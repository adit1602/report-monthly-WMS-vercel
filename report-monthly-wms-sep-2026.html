</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f8fafc; --panel:#ffffff; --panel2:#f1f5f9; --line:#e5e7eb; --line2:#d6dbe3;
  --txt:#0f1729; --txt2:#55617a; --txt3:#94a0b8;
  --indigo:#0d9488; --indigo-dim:#ccfbf1;
  --cyan:#0d9488; --cyan-dim:#ccfbf1;
  --blue:#0d9488; --blue-dim:#ccfbf1;
  --green:#16a34a; --green-dim:#dcfce7;
  --amber:#f59e0b; --amber-dim:#fef3c7;
  --red:#dc2626; --red-dim:#fee2e2;
  --violet:#7c3aed; --violet-dim:#ede9fe;
  --c314:#0d9488; --c323:#16a34a; --c347:#f59e0b;
  --r:10px; --r-lg:12px;
  --shadow:0 1px 2px rgba(15,23,41,.04),0 10px 30px rgba(15,23,41,.06);
  --shadow-sm:0 1px 2px rgba(15,23,41,.06);
  --grad:linear-gradient(135deg,#0d9488,#0f766e);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;
  background-image:radial-gradient(1000px 520px at 90% -10%,rgba(13,148,136,.12),transparent),radial-gradient(760px 420px at -5% 0%,rgba(45,212,191,.10),transparent);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
  padding:12px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;font-family:'JetBrains Mono';box-shadow:0 6px 16px rgba(13,148,136,.4)}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand .sub{font-size:11px;color:var(--txt2);font-family:'JetBrains Mono'}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;font-family:'JetBrains Mono';padding:7px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);box-shadow:var(--shadow-sm)}
.pill .dot{width:7px;height:7px;border-radius:99px;background:var(--green)}
.pill.live .dot{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.datectl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:99px;padding:5px 6px 5px 14px;box-shadow:var(--shadow-sm)}
.datectl label{font-size:11px;color:var(--txt2);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:.06em}
.datectl select{font:inherit;font-family:'JetBrains Mono';font-size:12.5px;font-weight:700;color:var(--indigo);border:none;background:var(--indigo-dim);padding:5px 10px;border-radius:99px;cursor:pointer;outline:none}
.iconbtn{cursor:pointer;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--txt2);display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:.15s}
.iconbtn:hover{color:var(--indigo);border-color:var(--indigo)}
.iconbtn svg{width:16px;height:16px}

/* hero */
.hero{max-width:1480px;margin:22px auto 0;padding:0 26px}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero-card::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:.96}
.hero-inner{position:relative;padding:26px 30px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;color:#fff}
.hero-inner h2{font-size:23px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.hero-inner .meta{font-size:12.5px;opacity:.92;font-family:'JetBrains Mono';margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}
.hero-inner .meta span{display:inline-flex;align-items:center;gap:6px}
.hero-stat{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap}
.hero-stat .hs{text-align:right}
.hero-stat .hs .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.85;font-family:'JetBrains Mono'}
.hero-stat .hs .v{font-size:21px;font-weight:800;font-family:'JetBrains Mono';margin-top:3px}

/* tabs */
.tabs{display:flex;gap:4px;padding:0 26px;margin:18px auto 0;max-width:1480px;border-bottom:1px solid var(--line);position:sticky;top:65px;z-index:40;background:rgba(238,241,248,.8);backdrop-filter:blur(14px);overflow-x:auto}
.tab{cursor:pointer;padding:13px 18px;font-size:13.5px;font-weight:600;color:var(--txt2);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.tab .ic{width:16px;height:16px}

.wrap{padding:22px 26px 40px;max-width:1480px;margin:0 auto}
.page{display:none}.page.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(max-width:640px){.g4{grid-template-columns:1fr}}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 14px}
.sec-head:first-child{margin-top:0}
.sec-head .eyebrow{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);font-weight:600}
.sec-head h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sec-head .hint{font-size:12px;color:var(--txt3);margin-left:auto}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(15,23,41,.04),0 16px 34px rgba(15,23,41,.1)}
.card .ttl{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .ttl .tag{font-family:'JetBrains Mono';font-size:10px;color:var(--txt3);font-weight:500}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:.18s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(16,23,41,.04),0 16px 38px rgba(16,23,41,.1)}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--indigo))}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent,var(--indigo));opacity:.06}
.kpi .lab{font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:8px}
.kpi .val{font-family:'JetBrains Mono';font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .meta{font-size:11.5px;color:var(--txt3);margin-top:6px;font-family:'JetBrains Mono'}
.kpi .delta{font-size:11px;font-weight:700;font-family:'JetBrains Mono';margin-top:5px}
.up{color:var(--green)}.down{color:var(--red)}

.barrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.barrow .nm{font-family:'JetBrains Mono';font-size:11px;width:46px;color:var(--txt2);font-weight:500}
.barrow .track{flex:1;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.barrow .fill{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.barrow .vv{font-family:'JetBrains Mono';font-size:11px;width:64px;text-align:right;font-weight:600}
.gauge{display:flex;align-items:center;gap:16px}
/* kalender kesehatan harian (heatmap) -- dipakai laporan bulanan */
.calwrap{overflow-x:auto;padding-bottom:4px}
.calrow{display:flex;align-items:center;gap:3px;margin-bottom:3px}
.callabel{width:100px;flex:none;font-family:'JetBrains Mono';font-size:10.5px;color:var(--txt2);font-weight:600}
.calcells{display:flex;gap:3px}
.calcell{width:22px;height:22px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-family:'JetBrains Mono';color:#fff;font-weight:700}
.calcell.g{background:var(--green)}
.calcell.y{background:var(--amber)}
.calcell.r{background:var(--red)}
.calcell.n{background:var(--panel2);color:var(--txt3)}
.calhead .callabel{color:transparent}
.calhead .calcell{background:transparent;color:var(--txt3);font-weight:600}
.callegend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.callegend .li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt2);font-family:'JetBrains Mono'}
.callegend .sw{width:12px;height:12px;border-radius:3px}
.gstats{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.gi{font-size:11px;font-weight:700;font-family:'JetBrains Mono';padding:4px 10px;border-radius:99px;white-space:nowrap}
.gi.ok{background:var(--green-dim);color:#08855d}
.gi.warn{background:var(--amber-dim);color:#b46d05}
.gi.bad{background:var(--red-dim);color:#d11e3c}
.gi.mut{background:var(--panel2);color:var(--txt3)}
.gauge .ring{position:relative;width:98px;height:98px;flex:none}
.gauge .ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .ring .ctr .n{font-family:'JetBrains Mono';font-size:21px;font-weight:700}
.gauge .ring .ctr .u{font-size:10px;color:var(--txt3)}
.gauge .info .h{font-size:14px;font-weight:700;font-family:'JetBrains Mono'}
.gauge .info .d{font-size:12px;color:var(--txt2);margin-top:4px}
.chart{position:relative;width:100%}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--panel2);color:var(--txt2);font-weight:700;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:normal;word-break:break-word;line-height:1.3;max-width:110px;position:sticky;top:0}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
td.n,th.n{text-align:right;font-family:'JetBrains Mono'}
.code{font-family:'JetBrains Mono';font-size:12px;background:var(--panel2);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;font-family:'JetBrains Mono'}
.b-ok{background:var(--green-dim);color:#08855d}.b-info{background:var(--indigo-dim);color:#0f6f66}.b-warn{background:var(--amber-dim);color:#b46d05}.b-bad{background:var(--red-dim);color:#d11e3c}
.b-mut{background:var(--panel2);color:var(--txt3)}.b-info{background:var(--blue-dim);color:#0f6f66}
.dpos{color:var(--red)}.dneg{color:var(--green)}.dzero{color:var(--txt3)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:7px;vertical-align:middle}
.scroll-tbl{max-height:360px;overflow-y:auto}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--red-dim);border:1px solid #f6c2cb;border-radius:var(--r);padding:13px 15px;margin-bottom:16px}
.alert .ai{width:18px;height:18px;color:var(--red);flex:none;margin-top:1px}
.alert .at{font-size:13px}.alert .at b{color:#d11e3c}
.note{font-size:12px;color:var(--txt3);margin-top:10px;font-family:'JetBrains Mono'}
.split{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg{cursor:pointer;font-size:12px;font-weight:600;padding:6px 13px;border-radius:99px;border:1px solid var(--line2);color:var(--txt2);background:var(--panel)}
.seg.on{background:var(--indigo-dim);border-color:var(--indigo);color:var(--indigo)}
.statbar{display:flex;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;background:var(--panel);box-shadow:var(--shadow)}
.statbar .cell{flex:1;padding:16px 18px;border-right:1px solid var(--line)}
.statbar .cell:last-child{border-right:none}
.statbar .cell .k{font-size:11px;color:var(--txt2);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;font-weight:600}
.statbar .cell .v{font-size:21px;font-weight:700;font-family:'JetBrains Mono';display:flex;align-items:center;gap:9px}
.statbar .cell .dl{font-size:11px;font-weight:700;font-family:'JetBrains Mono';margin-top:5px}
@media(max-width:900px){.statbar{flex-wrap:wrap}.statbar .cell{min-width:50%}}
.empty{text-align:center;padding:50px 20px;color:var(--txt3)}
.foot{max-width:1480px;margin:30px auto 0;padding:22px 26px;border-top:1px solid var(--line);text-align:center}
.foot-title{font-weight:700;font-size:13px;color:var(--txt);margin-bottom:6px}
.foot-meta{color:var(--txt3);font-size:11.5px;font-family:'JetBrains Mono',monospace;line-height:1.6}

/* editor drawer */
.scrim{position:fixed;inset:0;background:rgba(16,23,41,.45);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--panel);z-index:100;box-shadow:-20px 0 60px rgba(16,23,41,.2);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .dh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .dh .ic{width:34px;height:34px;border-radius:9px;background:var(--indigo-dim);color:var(--indigo);display:grid;place-items:center}
.drawer .dh h3{font-size:15px;font-weight:800}
.drawer .dh p{font-size:11px;color:var(--txt2)}
.drawer .db{padding:20px 22px;overflow-y:auto;flex:1}
.drawer .step{font-size:11px;font-family:'JetBrains Mono';color:var(--indigo);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 9px}
.drawer .step:first-child{margin-top:0}
.bigbtn{width:100%;cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:13px 16px;border-radius:11px;border:1px dashed var(--line2);background:var(--panel2);color:var(--txt);display:flex;align-items:center;gap:11px;transition:.15s;margin-bottom:9px}
.bigbtn:hover{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-dim)}
.bigbtn svg{width:18px;height:18px;flex:none}
.bigbtn small{display:block;font-weight:500;color:var(--txt3);font-size:11px;margin-top:2px}
.loaded{font-size:12px;font-family:'JetBrains Mono';background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;min-height:46px;color:var(--txt2)}
.loaded .row{display:flex;justify-content:space-between;padding:3px 0}
.loaded .row b{color:var(--green)}
.dl-btn{width:100%;cursor:pointer;font:inherit;font-size:14px;font-weight:800;padding:15px;border-radius:12px;border:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 22px rgba(13,148,136,.4);transition:.15s}
.dl-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.dl-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.dl-btn svg{width:18px;height:18px}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--txt3);font-family:'JetBrains Mono';display:flex;justify-content:space-between;align-items:center}
.kbd{font-family:'JetBrains Mono';font-size:10.5px;background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--txt2)}
.toast{position:fixed;bottom:24px;left:50%;transform:transl(-50%,80px);translate:-50% 0;z-index:300;background:var(--txt);color:#fff;border-radius:11px;padding:13px 20px;font-size:13px;font-weight:600;box-shadow:0 14px 44px rgba(16,23,41,.3);opacity:0;transition:.3s;max-width:380px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red)}

@media print{
  .topbar,.tabs,.drawer,.scrim,.toast,.iconbtn,.datectl{display:none!important}
  .page{display:block!important;page-break-inside:avoid}
  body{background:#fff;background-image:none}
  .card,.kpi{box-shadow:none;border:1px solid #ccc}
  .hero-card::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* all-tabs layout for PDF/print */
.print-all .tabs{display:none!important}
.print-all .page{display:block!important;page-break-after:always;margin-bottom:8px}
.print-all .page:last-child{page-break-after:auto}
.print-all .fill{transition:none!important}
@media print{
  .topbar{position:static}
  .tabs{display:none!important}
  .page{display:block!important;page-break-after:always}
  body{background:#fff;background-image:none}
  .card,.kpi{box-shadow:none;border:1px solid #ccc}
}

/* ============================================================ */
/* TAB INFRASTRUCTURE v2 -- kartu ikon, badge nilai, host-selector, sticky detail table */
/* ============================================================ */
.kpi-card{flex:1;min-width:170px;background:#ffffff;border:1px solid var(--line);border-left:4px solid var(--kpi-border,#cbd5e1);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.kpi-card:hover{box-shadow:var(--shadow)}
.kpi-card .l{font-size:11px;color:var(--txt2);font-weight:600;margin-bottom:5px}
.kpi-card .v{font-size:19px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1.15;color:var(--txt)}
.kpi-card .v .u{font-size:12px;font-weight:600;color:var(--txt3);margin-left:2px}
/* Warna SOFT (bukan vibrant) -- cuma pada border kiri, badan kartu tetap putih polos */
.kpi-card.kpi-success{--kpi-border:#86efac}
.kpi-card.kpi-warning{--kpi-border:#fde68a}
.kpi-card.kpi-critical{--kpi-border:#fca5a5}
.kpi-card.kpi-info{--kpi-border:#93c5fd}
.kpi-row{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}

.vbadge{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 9px;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700}
.vbadge.g{background:var(--green-dim);color:#0d6b34}
.vbadge.b{background:var(--indigo-dim);color:#0f6f66}
.vbadge.y{background:var(--amber-dim);color:#92400e}
.vbadge.r{background:var(--red-dim);color:#a11414}

.hostsel{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.hostsel button{cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);color:var(--txt2);transition:.15s}
.hostsel button:hover{border-color:var(--indigo);color:var(--indigo)}
.hostsel button.on{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.3)}

.detail-tbl{border-collapse:separate;border-spacing:0;width:auto;min-width:100%}
.detail-tbl th{height:42px;box-sizing:border-box;vertical-align:middle;font-size:10px;line-height:1.25;padding:4px 10px;white-space:nowrap;word-break:normal;max-width:none}
.detail-tbl td.n{white-space:nowrap}
.detail-tbl thead tr:nth-child(1) th{position:sticky;top:0;z-index:3;background:#eef2f9}
.detail-tbl thead tr:nth-child(2) th{position:sticky;top:42px;z-index:3;background:#eef2f9}
.detail-tbl thead tr:nth-child(3) th{position:sticky;top:84px;z-index:3;background:#eef2f9}
.detail-tbl th{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
.detail-tbl td{border-right:1px solid var(--line)}
.detail-tbl th:last-child,.detail-tbl td:last-child{border-right:none}
.detail-tbl th.grp{text-align:center;font-size:10.5px;letter-spacing:.03em;background:var(--indigo-dim)!important;color:var(--indigo)}
.detail-tbl th.mount-sub{font-size:9.5px;color:var(--txt2);font-weight:600;background:#f6f8fc!important}
.detail-tbl tbody tr{background:var(--panel)}
.detail-tbl tbody tr:nth-child(even){background:#fbfcfe}
.detail-tbl tbody tr:hover{background:var(--indigo-dim)}
.detail-tbl td.datecell{position:sticky;left:0;background:inherit;font-weight:700;z-index:1;box-shadow:1px 0 0 var(--line);white-space:nowrap}
.detail-tbl thead th.datecell{position:sticky;left:0;top:0;z-index:5!important;background:#eef2f9}

.trend-card .ttl{display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--txt2)}

/* N/A state -- Disk Usage tidak tersedia dari sar */
.vbadge.na{background:var(--panel2);color:var(--txt3);font-style:italic}
.fs-na{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;color:var(--txt3);text-align:center}
.fs-na svg{width:34px;height:34px;opacity:.6}
.fs-na div{font-size:13px;font-weight:600}
.fs-na .fs-na-sub{font-size:11.5px;font-weight:400;color:var(--txt3);opacity:.8}

/* chart tren harian -- semua tanggal tampil, scroll horizontal kalau lebih lebar dari card */
.chart-scrollx{overflow-x:auto;overflow-y:hidden;position:relative}
.chart-scrollx::-webkit-scrollbar{height:8px}
.chart-scrollx::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.chart-scrollx::-webkit-scrollbar-track{background:var(--panel2)}

/* indikator tetap Warning/Critical -- BUKAN legend Chart.js, tidak bisa diklik/di-toggle */
.thr-fixed{display:flex;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.thr-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;padding:4px 10px;border-radius:99px;cursor:default;user-select:none}
.thr-chip.warn{background:var(--amber-dim);color:#92400e}
.thr-chip.crit{background:var(--red-dim);color:#991b1b}

/* selector metric Record/Amount -- warna beda saat aktif, sesuai spek */
.metric-sel button.m-record.on{background:#0d9488;border-color:#0d9488}
.metric-sel button.m-amount.on{background:#f59e0b;border-color:#f59e0b}
.metric-sel button:disabled{opacity:.4;cursor:not-allowed}
.metric-sel button:disabled:hover{border-color:var(--line2);color:var(--txt2)}

/* kpi-row 4 kolom (8 kartu = 2 baris rata) */
.kpi-row.k4{display:grid;grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.kpi-row.k4{grid-template-columns:repeat(2,1fr)}}

/* EOD execution table: ringkasan di kiri, job di kanan, sel berwarna sesuai status job */
.eod-tbl td{padding:6px 10px;font-size:12px}
.eod-tbl th.jh{white-space:normal;height:auto;min-width:92px;max-width:112px;font-size:9.5px;line-height:1.3;word-break:normal;overflow-wrap:normal}
.eod-tbl th.notecol,.eod-tbl td.notecol{min-width:260px;max-width:340px;white-space:normal;font-size:11.5px;color:var(--txt2);text-align:left}
.eod-tbl td.cellbad,.eod-legend .cellbad{background:#fde8e8;color:#b42318;font-weight:700}
.eod-tbl td.cellwarn,.eod-legend .cellwarn{background:#fff4d6;color:#8a5a00;font-weight:700}
.eod-legend{font-size:11.5px;color:var(--txt2);margin:0 0 8px}
.eod-legend span{padding:1px 8px;border-radius:4px}

/* --- tambahan komponen khusus dashboard (kpi band, filter bar, executive block) --- */
.kpiband{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
.kpiband .kb{flex:1;min-width:160px;border-radius:var(--r-lg);padding:16px 18px;color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.kpiband .kb:hover{transform:translateY(-2px)}
.kpiband .kb .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-family:'JetBrains Mono'}
.kpiband .kb .v{font-size:24px;font-weight:800;font-family:'JetBrains Mono';margin-top:6px}
.kb.navy{background:linear-gradient(135deg,#1e293b,#334155)}
.kb.ok{background:linear-gradient(135deg,#16a34a,#15803d)}
.kb.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.kb.bad{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filterbar .fitem{display:flex;flex-direction:column;gap:4px}
.filterbar label{font-size:10.5px;color:var(--txt2);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:.06em}
.filterbar select,.filterbar input{font:inherit;font-size:12.5px;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--txt);min-width:150px}
.filterbar .fbtn{align-self:flex-end;cursor:not-allowed;opacity:.55;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:9px;border:none;background:var(--indigo);color:#fff}
.exec-block{margin-bottom:26px}
.exec-block .blk-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.exec-block .blk-head h3{font-size:14.5px;font-weight:800}
.exec-block .blk-head .dot{width:8px;height:8px;border-radius:99px;background:var(--indigo)}
</style>
</head>

/* ============ AI INSIGHT (Gemini, ai/ai_insight_generator.py -> ai_insight.json) ============
   MURNI render -- seluruh isi (termasuk angka yang disebut) SUDAH
   digenerate Python dari evidence digest yang SAMA dgn tabel-tabel di
   atas (ai/digest_builder.py). JS di sini TIDAK menghitung/menyusun
   narasi apa pun, cuma menampilkan field yang sudah ada di D.aiInsight. */
function renderAIInsight(ai) {
  const emptyCard = (msg) => `<div class="card" style="padding:16px;color:var(--txt2);font-size:12.5px">${msg}</div>`;
  const bulletList = (items, emptyMsg) => !items || !items.length ? emptyCard(emptyMsg)
    : `<div class="card" style="padding:14px 18px"><ul style="margin:0;padding-left:18px;line-height:1.7">${items.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
  const severityBadge = (sev) => {
    const cls = sev === 'high' ? 'b-bad' : sev === 'medium' ? 'b-warn' : 'b-ok';
    return `<span class="badge ${cls}">${(sev || '-').toUpperCase()}</span>`;
  };
  // 1 helper generik utk tabel 2-3 kolom yg polanya sama (risk/regression/
  // bottleneck/infra health/actions/capacity) -- cuma beda daftar kolom,
  // TIDAK diduplikasi 6x.
  const table = (items, columns, emptyMsg) => {
    if (!items || !items.length) return emptyCard(emptyMsg);
    let t = `<div class="tw"><table><thead><tr>${columns.map(c => `<th>${c.label}</th>`).join('')}</tr></thead><tbody>`;
    items.forEach(row => {
      t += '<tr>' + columns.map(c => `<td${c.numeric ? ' class="n"' : ''}${c.muted ? ' style="color:var(--txt2);font-size:12px"' : ''}>${c.render ? c.render(row) : (row[c.key] || '')}</td>`).join('') + '</tr>';
    });
    t += `</tbody></table></div>`;
    return t;
  };

  let h = `<div class="sec-head"><span class="eyebrow">AI Insight</span><h2>Executive AI Summary</h2><span class="hint">Digenerate Gemini dari data yang sudah dihitung${ai.meta && ai.meta.generatedAt ? ' &middot; ' + ai.meta.generatedAt : ''}</span></div>`;
  h += `<div class="card" style="padding:16px 18px;line-height:1.6;font-size:13.5px">${ai.executiveSummary || ''}</div>`;
  h += execBlock('Key Findings', bulletList(ai.keyFindings, 'Tidak ada temuan.'));
  h += execBlock('Risk Analysis', table(ai.riskAnalysis, [
    { label: 'Risk', key: 'risk' },
    { label: 'Severity', render: r => severityBadge(r.severity) },
    { label: 'Evidence', key: 'evidence', muted: true },
  ], 'Tidak ada risiko teridentifikasi.'));
  h += execBlock('Performance Highlights', bulletList(ai.performanceHighlights, 'Tidak ada highlight.'));
  h += execBlock('Performance Regression', table(ai.performanceRegression, [
    { label: 'Metric', key: 'metric' },
    { label: 'Evidence', key: 'evidence', muted: true },
  ], 'Tidak ada regresi teridentifikasi.'));
  h += execBlock('Bottleneck Analysis', table(ai.bottleneckAnalysis, [
    { label: 'Area', key: 'area' },
    { label: 'Detail', key: 'detail', muted: true },
  ], 'Tidak ada bottleneck teridentifikasi.'));
  h += execBlock('Infrastructure Health', table(ai.infrastructureHealth, [
    { label: 'Host', key: 'host' },
    { label: 'Assessment', key: 'assessment', muted: true },
  ], 'Tidak ada catatan tambahan.'));
  h += execBlock('Recommended Actions', table(ai.recommendedActions, [
    { label: 'Action', key: 'action' },
    { label: 'Priority', render: r => severityBadge(r.priority) },
    { label: 'Rationale', key: 'rationale', muted: true },
  ], 'Tidak ada rekomendasi.'));
  h += execBlock('Capacity Planning', table(ai.capacityPlanning, [
    { label: 'Resource', key: 'resource' },
    { label: 'Suggestion', key: 'suggestion', muted: true },
    { label: 'Horizon', key: 'horizon' },
  ], 'Tidak ada saran capacity planning.'));
  return h;
}

/* ============ OVERALL DASHBOARD ANALYSIS (exception-based, findings_engine.py -> summary_notes.json) ============
   MURNI render -- domain/severity/concern/recommendation SUDAH dipilih
   Python sbg SATU concern PALING PENTING per domain (exception-based,
   bukan ringkasan semua metrik). JS di sini TIDAK mengevaluasi apa pun,
   cuma menampilkan 1 tabel: Domain | Concern | Usulan Perbaikan. */
function renderDashboardAnalysis(analysis) {
  const domainLabels = { infrastructure: 'Infrastructure', eod: 'EOD & SOD', operationalJob: 'Cyclic Job', transaction: 'Transaction' };
  const SEV_COLOR = { Critical: 'var(--red)', Warning: '#b46d05', Healthy: 'var(--txt2)' };
  let t = `<div class="tw"><table><thead><tr><th style="width:150px">Domain</th><th>Concern</th><th>Usulan Perbaikan</th></tr></thead><tbody>`;
  Object.keys(domainLabels).forEach(key => {
    const a = analysis[key];
    if (!a) return;
    t += `<tr><td><b>${domainLabels[key]}</b></td>
      <td style="color:${SEV_COLOR[a.severity] || 'var(--txt)'}">${a.concern}</td>
      <td style="color:var(--txt2);font-size:12.5px">${a.recommendation}</td></tr>`;
  });
  t += `</tbody></table></div>`;
  const h = `<div class="card">${t}</div>`;
  return h;
}

/* ============ EXECUTIVE HEALTH SCORE (deterministik, health_score.py) ============ */
function renderHealthScoreBand(hs) {
  if (!hs) return '';
  // STATUS_4TIER & STATUS_META SUDAH ADA (dipakai Infrastructure) -- dipakai ULANG
  // di sini apa adanya, supaya warna 'Optimal/Normal/Warning/Critical' konsisten

  const KB_CLASS = { green: 'ok', blue: 'navy', yellow: 'warn', red: 'bad' };
  const card = (label, node) => {
    if (!node || node.score == null) {
      return `<div class="kb navy"><div class="l">${label}</div><div class="v">N/A</div></div>`;
    }
    const color = STATUS_4TIER[node.status] || 'blue';
    return `<div class="kb ${KB_CLASS[color]}"><div class="l">${label}</div><div class="v">${node.score}</div>
      <div class="meta" style="opacity:.85;font-size:10.5px;text-transform:capitalize;margin-top:2px">${node.status || 'n/a'}</div></div>`;
  };
  let h = `<div class="sec-head"><span class="eyebrow">Health Score</span><h2>Executive Health Score</h2><span class="hint">Skor deterministik dari metrik yang sudah dihitung tiap tab &middot; bukan AI</span></div>`;
  h += `<div class="kpiband">
    ${card('Overall', hs.overall)}
    ${card('Infrastructure', hs.infrastructure)}
    ${card('Operational', hs.operational)}

  return h;

const STATUS_LABEL = { green: 'Normal', yellow: 'Warning', red: 'Critical' };
// Mapping status yg SUDAH DIHITUNG di Python (thresholds.py) -> warna kartu JS.
// JS TIDAK menghitung ulang batas angka -- cuma menerjemahkan label ke warna,
// supaya threshold selalu satu sumber (thresholds.py), tidak terduplikasi di sini.
const STATUS_3TIER = { normal: 'green', warning: 'yellow', critical: 'red' };
const STATUS_4TIER = { optimal: 'green', ideal: 'green', normal: 'blue', warning: 'yellow', critical: 'red' };
// Kartu KPI: border kiri warna SOFT (bukan warna vibrant yg dipakai badge/chart),
// background tetap putih polos -- gaya dashboard enterprise yg clean.
const SOFT_STATUS_CLASS = { green: 'kpi-success', yellow: 'kpi-warning', red: 'kpi-critical', neutral: 'kpi-info' };
function vstatus(val, thr) {
  // thr = [t0, t1, t2] -- 3 batas menghasilkan 4 tingkat: optimal/normal/warning/critical
  if (val == null) return null;
  if (val < thr[0]) return 'optimal';
  if (val < thr[1]) return 'normal';
  if (val < thr[2]) return 'warning';
  return 'critical';
}
const VBADGE_CLASS = { optimal: 'g', normal: 'b', warning: 'y', critical: 'r' };
function vbadge(val, thr, unit) {
  if (val == null) return `<span class="vbadge na">N/A</span>`;
  const cls = VBADGE_CLASS[vstatus(val, thr)] || 'g';
  return `<span class="vbadge ${cls}">${val}${unit || '%'}</span>`;
}
function hostOverallStatus(hh) {
  // Status keseluruhan SUDAH DIHITUNG di Python (business_rules.host_overall_status,
  // severity tertinggi lintas CPU/Memory/Disk Capacity/Disk I/O) -- di sini cuma
  // baca, TIDAK dihitung ulang (satu sumber kebenaran, hindari duplikasi logika).
  const st = hh.status && hh.status.overall;
  return VBADGE_CLASS[st] === 'r' ? 'red' : VBADGE_CLASS[st] === 'y' ? 'yellow' : VBADGE_CLASS[st] === 'b' ? 'blue' : 'green';
}
function kpiCard(icon, label, value, unit, status) {
  const cls = SOFT_STATUS_CLASS[status] || SOFT_STATUS_CLASS.neutral;
  return `<div class="kpi-card ${cls}">
    <div class="l">${label}</div><div class="v">${value}<span class="u">${unit || ''}</span></div>
  </div>`;
}

/* ============ FORECAST OVERLAY (forecast_engine.py, Linear Regression) ============
   Dipakai BERSAMA oleh Infrastructure Trend chart (per host/metrik, harian)
   & EOD/Cyclic Job Monthly Comparison chart (bulanan) -- SATU
   implementasi overlay, tidak diduplikasi per chart. Field 'forecast'
   SELALU dicek dulu di tiap call site (guard) -- kalau belum ada
   (data lama/belum di-generate ulang), fungsi ini tidak dipanggil sama
   sekali dan chart render PERSIS seperti sebelum fitur ini ada. */
function padForForecast(values, forecastLen) {
  // Pad dataset HISTORIS dgn null di ekor sepanjang titik forecast, supaya
  // panjangnya match dgn label baru (chart.js butuh semua dataset
  // sepanjang labels) -- nilai historis SENDIRI TIDAK diubah sama sekali.
  return forecastLen ? values.concat(new Array(forecastLen).fill(null)) : values.slice();
}
function forecastOverlayDataset(baseValues, forecastValues, label, color) {
  // Bangun 1 dataset GARIS PUTUS-PUTUS yang menyambung dari titik TERAKHIR
  // data asli (baseValues) ke titik-titik forecast -- null di semua index
  // lain supaya tidak menggambar garis di rentang data historis.
  if (!forecastValues || !forecastValues.length) return null;
  const overlay = new Array(baseValues.length + forecastValues.length).fill(null);
  overlay[baseValues.length - 1] = baseValues[baseValues.length - 1];
  forecastValues.forEach((v, i) => { overlay[baseValues.length + i] = v; });
  return { label, data: overlay, borderColor: color, borderDash: [6, 4], borderWidth: 1.6, pointRadius: 2, pointStyle: 'rectRot', fill: false, spanGaps: false };
}

function forecastCaptionHtml(forecast) {
  // Caption ringkas dipasang di bawah chart "Comparison with Previous
  // Months" (EOD & Cyclic Job) -- menampilkan Forecast Max Duration
  // (TIDAK ikut tergambar di chart itu sendiri, krn chart-nya cuma py 2
  // metrik Avg/P95) sekaligus metode & bulan target. Guard: '' (tidak
  // render apa pun) kalau field 'forecast' belum ada -- data lama/blm
  // di-generate ulang pakai forecast_engine.py tetap tampil seperti biasa.
  if (!forecast) return '';
  const chip = (label, node) => {
    if (!node || node.nextValue == null) return `<span class="thr-chip" style="opacity:.65">${label}: N/A</span>`;
    return `<span class="thr-chip" style="background:var(--indigo-dim);color:#0f6f66">${label}: ${node.nextValue} min</span>`;
  };
  return `<div class="thr-fixed" style="margin-top:10px">
    ${chip('Forecast Avg', forecast.avgDuration)}
    ${chip('Forecast P95', forecast.p95Duration)}
    ${chip('Forecast Max', forecast.maxDuration)}
  </div>
  <div style="color:var(--txt2);font-size:11px;margin-top:6px">Metode: Linear Regression atas histori bulanan (Avg/P95 Duration) &middot; Max Duration diestimasi dari ekstrapolasi tren harian bulan berjalan (histori bulanan Max belum tersedia) &middot; bulan target: ${forecast.nextMonth || '-'}.</div>`;
}

function monthlyComparisonChartData(monthlyComparison, forecast) {
  // Dipakai BERSAMA oleh EOD & Cyclic Job "Comparison with Previous
  // Months" chart (pola identik di kedua domain) -- avgDuration/p95Duration
  // historis TIDAK berubah; forecast (kalau ada) HANYA menambah 1 titik
  // bulan berikutnya + 1 dataset overlay putus-putus per metrik.
  const labels = monthlyComparison.map(m => m.month);
  const avg = monthlyComparison.map(m => m.avgDuration);
  const p95 = monthlyComparison.map(m => m.p95Duration);
  const datasets = [
    { label: 'Average Duration', data: avg.slice(), borderColor: '#0d9488', backgroundColor: '#0d948822', borderWidth: 2, tension: .25, pointRadius: 4, fill: false },
    { label: 'P95 Duration', data: p95.slice(), borderColor: '#f59e0b', backgroundColor: '#f59e0b22', borderWidth: 2, tension: .25, pointRadius: 4, fill: false },
  ];
  const hasForecast = forecast && forecast.nextMonth
    && ((forecast.avgDuration && forecast.avgDuration.nextValue != null) || (forecast.p95Duration && forecast.p95Duration.nextValue != null));
  if (hasForecast) {
    labels.push(forecast.nextMonth + ' (F)');
    datasets[0].data.push(null);
    datasets[1].data.push(null);
    const avgOverlay = forecast.avgDuration.nextValue != null ? forecastOverlayDataset(avg, [forecast.avgDuration.nextValue], 'Average Duration (Forecast)', '#0d9488') : null;
    const p95Overlay = forecast.p95Duration.nextValue != null ? forecastOverlayDataset(p95, [forecast.p95Duration.nextValue], 'P95 Duration (Forecast)', '#f59e0b') : null;
    if (avgOverlay) datasets.push(avgOverlay);
    if (p95Overlay) datasets.push(p95Overlay);
  }
  return { labels, datasets };
}

function trendSectionHtml(def, hosts) {
  if (!trendHostSel[def.key]) trendHostSel[def.key] = hosts[0].hostname;
  const sel = trendHostSel[def.key];
  const selHost = hosts.find(hh => hh.hostname === sel) || hosts[0];
  // nPoints dipakai utk lebar area scroll horizontal chart -- HARUS ikut
  // menghitung titik forecast (kalau ada) supaya garis putus-putus forecast
  // tidak terpotong/kegencet di ujung kanan chart.
  const fc = selHost.forecast;
  const fcNode = def.multiFs
    ? Object.values((fc && fc.disk) || {}).find(n => n && n.dailyForecastDates && n.dailyForecastDates.length)
    : (fc && fc[def.metric]);
  const forecastPoints = (fcNode && fcNode.dailyForecastDates) ? fcNode.dailyForecastDates.length : 0;
  const nPoints = ((selHost.daily.dates || []).length || 30) + forecastPoints;
  let h = `<div class="sec-head"><span class="eyebrow">Tren Harian</span><h2>${def.title}</h2><span class="hint">threshold = indikator tetap &middot; seluruh tanggal ditampilkan</span></div>`;
  h += `<div class="card trend-card"><div class="hostsel" data-metric="${def.key}">`;
  hosts.forEach(hh => { h += `<button class="${hh.hostname === sel ? 'on' : ''}" data-host="${hh.hostname}">${hh.hostname}</button>`; });
  h += `</div>${fixedThresholdBadge(def)}`;
  h += `<div class="chart" style="height:270px;position:relative" id="trendwrap_${def.key}">`
    + chartScrollWrap(`trend_${def.key}`, 270, nPoints)
    + (def.multiFs ? `<div class="fs-na" id="fsna_${def.key}" style="display:none;position:absolute;inset:0;background:var(--panel)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>Disk Usage tidak tersedia pada file SAR.</div>
        <div class="fs-na-sub">Section sar -F (filesystem statistics) tidak ditemukan untuk host ini.</div>
      </div>` : '')
    + `</div></div>`;
  return h;
}
function drawTrendChart(def) {
  const inf = D.infra, THR = inf.meta.thresholds;
  const host = inf.hosts.find(hh => hh.hostname === trendHostSel[def.key]);
  const daily = host.daily;
  const forecast = host.forecast; // BARU (forecast_engine.py) -- undefined kalau data lama, semua guard di bawah

  if (def.multiFs) {
    const fsKeys = Object.keys(daily.disk || {});
    const canvasEl = document.getElementById('trend_' + def.key);
    const naEl = document.getElementById('fsna_' + def.key);
    if (!fsKeys.length) {
      if (charts['trend_' + def.key]) { charts['trend_' + def.key].destroy(); delete charts['trend_' + def.key]; }
      if (canvasEl) canvasEl.style.display = 'none';
      if (naEl) naEl.style.display = 'flex';
      return;
    }
    if (canvasEl) canvasEl.style.display = 'block';
    if (naEl) naEl.style.display = 'none';
  }

  // Forecast dates -- SATU sumber tanggal forecast utk SELURUH dataset di
  // chart ini (1 metrik cpu/memory/diskIO, ATAU seluruh mount Disk Usage).
  let forecastDates = null;
  if (forecast) {
    const node = def.multiFs
      ? Object.values(forecast.disk || {}).find(n => n && n.dailyForecastDates && n.dailyForecastDates.length)
      : forecast[def.metric];
    if (node && node.dailyForecastDates && node.dailyForecastDates.length) forecastDates = node.dailyForecastDates;
  }
  const forecastLen = forecastDates ? forecastDates.length : 0;
  const labels = daily.dates.map(fmtDateShort).concat((forecastDates || []).map(fmtDateShort));
  let datasets = [];
  if (def.multiFs) {
    const fsPalette = ['#f59e0b', '#0d9488', '#16a34a', '#7c3aed', '#dc2626', '#0891b2'];
    Object.keys(daily.disk).forEach((fs, i) => {
      const c = fsPalette[i % fsPalette.length];
      datasets.push({ label: host.hostname + ' ' + fs, data: padForForecast(daily.disk[fs], forecastLen), borderColor: c, backgroundColor: c + '22', borderWidth: 2, tension: .3, pointRadius: 0, fill: false, spanGaps: false });
      const node = forecast && forecast.disk && forecast.disk[fs];
      const overlay = node && forecastOverlayDataset(daily.disk[fs], node.dailyForecast, host.hostname + ' ' + fs + ' (Forecast)', c);
      if (overlay) datasets.push(overlay);
    });
  } else {
    datasets.push({ label: host.hostname, data: padForForecast(daily[def.metric], forecastLen), borderColor: def.color, backgroundColor: def.color + '22', borderWidth: 2, tension: .3, pointRadius: 0, fill: false, spanGaps: false });
    const node = forecast && forecast[def.metric];
    const overlay = node && forecastOverlayDataset(daily[def.metric], node.dailyForecast, host.hostname + ' (Forecast)', def.color);
    if (overlay) datasets.push(overlay);
  }
  if (def.thr) {
    const t = THR[def.thr];
    const warn = t[1], crit = t[2];
    // isThreshold: true -- dipakai legend.labels.filter utk menyembunyikan dari legend interaktif.
    // Garis TETAP digambar (dataset tetap ada), cuma tidak muncul sbg entri legend yg bisa diklik/di-toggle.
    datasets.push({ label: 'Warning ' + warn + '%', data: labels.map(() => warn), borderColor: '#f59e0b', borderDash: [6, 4], borderWidth: 1.3, pointRadius: 0, fill: false, isThreshold: true });
    datasets.push({ label: 'Critical ' + crit + '%', data: labels.map(() => crit), borderColor: '#dc2626', borderDash: [6, 4], borderWidth: 1.3, pointRadius: 0, fill: false, isThreshold: true });
  }
  mkChart('trend_' + def.key, {
    type: 'line', data: { labels, datasets },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: gridXAllDates, y: { ...gridY, suggestedMax: def.thr ? 100 : undefined, ticks: { callback: v => v + def.unit } } },
      plugins: {
        legend: {
          position: 'top', labels: {
            boxWidth: 9, font: { size: 9 },
            // Warning/Critical dikeluarkan dari legend -- jadi tidak bisa diklik/di-toggle,
            // dan tidak ikut berubah/hilang saat host lain dipilih (garisnya sendiri tetap tetap).
            filter: (item, chartData) => !(chartData.datasets[item.datasetIndex] || {}).isThreshold,
          },
        },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (c.raw == null ? 'tidak ada data' : c.raw + def.unit) } },
      } },
  });
}

/* ===== Detail Daily Infrastructure: PARSER (baca struktur, TIDAK render apa pun) ===== */
function parseDetailTableSchema(hosts) {
  // union semua tanggal dari semua host (bukan asumsi semua host cakupannya sama panjang/sejajar)
  const allDates = [...new Set(hosts.flatMap(hh => hh.daily.dates))].sort();
  // index per host: tanggal -> posisi array, supaya lookup selalu benar walau cakupan beda-beda
  const hostIdx = {};
  // mount point per host -- MURNI dari data (Object.keys), tidak ada "/","/db" ditulis manual di sini
  const hostMounts = {};
  hosts.forEach(hh => {
    hostIdx[hh.hostname] = {};
    hh.daily.dates.forEach((dt, i) => { hostIdx[hh.hostname][dt] = i; });
    hostMounts[hh.hostname] = Object.keys(hh.daily.disk || {});
  });
  return { allDates, hostIdx, hostMounts };
}

/* ===== Detail Daily Infrastructure: RENDERER (bangun HTML dari schema, rowspan/colspan dihitung) ===== */
function renderDetailTableHeader(hosts, hostMounts) {
  let row1 = `<tr><th class="datecell" rowspan="3">Date</th>`;
  let row2 = `<tr>`;
  let row3 = `<tr>`;
  hosts.forEach(hh => {
    const mounts = hostMounts[hh.hostname];
    const diskCols = mounts.length || 1; // minimal 1 kolom (N/A) kalau host tak punya mount point sama sekali
    const totalCols = 3 + diskCols;      // CPU + Memory + Disk Usage(N) + Disk I/O
    row1 += `<th class="grp" colspan="${totalCols}">${hh.hostname}</th>`;
    row2 += `<th class="n" rowspan="2">CPU P95</th><th class="n" rowspan="2">Memory P95</th>`;
    row2 += `<th class="n" colspan="${diskCols}">Disk Usage</th>`;
    row2 += `<th class="n" rowspan="2">Disk I/O P95 (%util)</th>`;
    if (mounts.length) mounts.forEach(m => { row3 += `<th class="n mount-sub">${m}</th>`; });
    else row3 += `<th class="n mount-sub">N/A</th>`;
  });
  return row1 + `</tr>` + row2 + `</tr>` + row3 + `</tr>`;
}
function renderDetailTableBody(hosts, schema) {
  const { allDates, hostIdx, hostMounts } = schema;
  let body = '';
  allDates.forEach(d => {
    body += `<tr><td class="datecell mono">${d}</td>`;
    hosts.forEach(hh => {
      const i = hostIdx[hh.hostname][d];
      const mounts = hostMounts[hh.hostname];
      const diskColCount = mounts.length || 1;
      if (i == null) {
        body += `<td class="n" style="color:var(--txt3)">&mdash;</td><td class="n" style="color:var(--txt3)">&mdash;</td>`;
        for (let k = 0; k < diskColCount; k++) body += `<td class="n" style="color:var(--txt3)">&mdash;</td>`;
        body += `<td class="n" style="color:var(--txt3)">&mdash;</td>`;
      } else {
        const dl = hh.daily;
        body += `<td class="n">${dl.cpu[i] != null ? dl.cpu[i] + '%' : '&mdash;'}</td><td class="n">${dl.memory[i] != null ? dl.memory[i] + '%' : '&mdash;'}</td>`;
        if (mounts.length) {
          mounts.forEach(m => {
            const v = dl.disk[m] ? dl.disk[m][i] : null;
            body += `<td class="n">${v != null ? v + '%' : '<span class="vbadge na">N/A</span>'}</td>`;
          });
        } else {
          body += `<td class="n"><span class="vbadge na">N/A</span></td>`;
        }
        const dio = dl.diskIO[i];
        body += `<td class="n">${dio != null ? dio + '%' : '<span class="vbadge na">N/A</span>'}</td>`;
      }
    });
    body += `</tr>`;
  });
  return body;
}
function renderDetailTable(hosts) {
  const schema = parseDetailTableSchema(hosts);
  const header = renderDetailTableHeader(hosts, schema.hostMounts);
  const body = renderDetailTableBody(hosts, schema);
  return `<div class="card" style="padding:0"><div class="scroll-tbl tw" style="max-height:460px">
    <table class="detail-tbl"><thead>${header}</thead><tbody>${body}</tbody></table>
  </div></div>`;
}

function renderInfra() {
  const inf = D.infra, THR = inf.meta.thresholds, hosts = inf.hosts;
  const safeMax = arr => { const f = arr.filter(v => v != null); return f.length ? Math.max(...f) : null; };
  const safeMean = arr => { const f = arr.filter(v => v != null); return f.length ? round1(f.reduce((a, b) => a + b, 0) / f.length) : null; };
  const avgCpu = safeMean(hosts.map(h => h.summary.cpuAvg));
  const peakCpu = safeMax(hosts.map(h => h.summary.cpuPeak));
  const avgMem = safeMean(hosts.map(h => h.summary.memoryAvg));
  const peakMem = safeMax(hosts.map(h => h.summary.memoryPeak));
  const highestDisk = safeMax(hosts.map(h => h.summary.diskUsage));
  const highestDiskIO = safeMax(hosts.map(h => h.summary.diskIOP95));

  let h = `<div class="sec-head"><span class="eyebrow">Infrastructure</span><h2>Infrastructure Summary</h2><span class="hint">${inf.meta.period}</span></div>`;
  h += `<div class="kpi-row">`
    + kpiCard('server', 'Total Host', hosts.length, '', 'neutral')
    + kpiCard('cpu', 'Average CPU', avgCpu ?? 'N/A', avgCpu != null ? '%' : '', STATUS_4TIER[vstatus(avgCpu, THR.cpu)] || "neutral")
    + kpiCard('peak', 'Peak CPU', peakCpu ?? 'N/A', peakCpu != null ? '%' : '', STATUS_4TIER[vstatus(peakCpu, THR.cpu)] || "neutral")
    + kpiCard('memory', 'Average Memory', avgMem ?? 'N/A', avgMem != null ? '%' : '', STATUS_4TIER[vstatus(avgMem, THR.memory)] || "neutral")
    + kpiCard('peak', 'Peak Memory', peakMem ?? 'N/A', peakMem != null ? '%' : '', STATUS_4TIER[vstatus(peakMem, THR.memory)] || "neutral")
    + kpiCard('disk', 'Highest Disk Usage', highestDisk ?? 'N/A', highestDisk != null ? '%' : '', STATUS_4TIER[vstatus(highestDisk, THR.diskUsage)] || "neutral")
    + kpiCard('activity', 'Highest Disk I/O', highestDiskIO ?? 'N/A', highestDiskIO != null ? '%' : '', STATUS_4TIER[vstatus(highestDiskIO, THR.diskIO)] || "neutral")
    + `</div>`;
  if (!inf.meta.diskUsageGloballyAvailable) {
    h += `<div class="note" style="margin:-8px 0 16px">${inf.meta.diskUsageNote}</div>`;
  }

  h += `<div class="sec-head"><span class="eyebrow">Per Host</span><h2>Summary per Host</h2><span class="hint">CPU: Acceptable&lt;${THR.cpu[0]}% Warning ${THR.cpu[0]}-${THR.cpu[2]}% Critical&gt;${THR.cpu[2]}% &middot; Memory/Storage: Acceptable&lt;${THR.memory[0]}% Warning ${THR.memory[0]}-${THR.memory[2]}% Critical&gt;${THR.memory[2]}% &middot; Disk I/O (%util, belum bagian threshold resmi): optimal&lt;${THR.diskIO[0]}% normal&lt;${THR.diskIO[1]}% warning&lt;${THR.diskIO[2]}%</span></div>`;
  h += `<div class="card"><div class="tw"><table><thead><tr><th>Host</th><th class="n">CPU Avg</th><th class="n">CPU P95</th><th class="n">CPU Peak</th><th class="n">Memory Avg</th><th class="n">Memory P95</th><th class="n">Memory Peak</th><th class="n">Disk Usage</th><th class="n">Disk (/) Avg</th><th class="n">Disk (/) P95</th><th class="n">Disk (/db) Avg</th><th class="n">Disk (/db) P95</th><th class="n">Disk I/O (%util)</th><th>Status</th></tr></thead><tbody>`;
  hosts.forEach(hh => {
    const s = hh.summary; const st = hostOverallStatus(hh); const sm = STATUS_META[st];
    h += `<tr><td><span class="code">${hh.hostname}</span></td>
      <td class="n">${vbadge(s.cpuAvg, THR.cpu)}</td><td class="n">${vbadge(s.cpuP95, THR.cpu)}</td><td class="n">${vbadge(s.cpuPeak, THR.cpu)}</td>
      <td class="n">${vbadge(s.memoryAvg, THR.memory)}</td><td class="n">${vbadge(s.memoryP95, THR.memory)}</td><td class="n">${vbadge(s.memoryPeak, THR.memory)}</td>
      <td class="n">${vbadge(s.diskUsage, THR.diskUsage)}</td>
      <td class="n">${vbadge(s.diskRootAvg, THR.diskUsage)}</td><td class="n">${vbadge(s.diskRootP95, THR.diskUsage)}</td>
      <td class="n">${vbadge(s.diskDbAvg, THR.diskUsage)}</td><td class="n">${vbadge(s.diskDbP95, THR.diskUsage)}</td>
      <td class="n">${vbadge(s.diskIOP95, THR.diskIO)}</td>
      <td><span class="badge ${sm.cls}">${sm.label}</span></td></tr>`;
  });
  h += `</tbody></table></div></div>`;

  TREND_DEFS.forEach(def => { h += trendSectionHtml(def, hosts); });

  h += `<div class="sec-head"><span class="eyebrow">Detail</span><h2>Detail Daily Infrastructure</h2><span class="hint">CPU/Memory P95 harian &middot; Disk Usage angka aktual harian (df -h, sebelum di-P95-kan) &middot; subkolom Disk Usage mengikuti mount point yang ditemukan per host</span></div>`;
  h += renderDetailTable(hosts);

  document.getElementById('p-infra').innerHTML = h;
  TREND_DEFS.forEach(drawTrendChart);
  document.querySelectorAll('.hostsel').forEach(bar => {
    bar.addEventListener('click', e => {
      const btn = e.target.closest('button[data-host]');

      const metric = bar.dataset.metric;
      trendHostSel[metric] = btn.dataset.host;
      bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      drawTrendChart(TREND_DEFS.find(d => d.key === metric));
    });
  });
}
function mean(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }
function round1(n) { return Math.round(n * 10) / 10; }

let eodSelectedJob = null;

function dailyVolumeHtml(kind, canvasId, daily) {

const VOL_TOP_N = 10;
const VOL_COLORS = ['#2563eb', '#f97316', '#16a34a', '#dc2626', '#7c3aed', '#0891b2', '#ca8a04', '#db2777', '#4d7c0f', '#475569'];
function drawDailyVolume(canvasId, daily, jobNames) {
  if (!daily || !document.getElementById(canvasId)) return;
  const short = n => n.replace(/^(eod_|daily_)/, '').replace(/_(bu_id|bu_sent)$/, '');
  const dur = (d, n) => d.jobDurations[n] || 0;
  // job diurutkan menurut total durasi; N teratas diberi warna sendiri, sisanya digabung "Lainnya"
  const ranked = jobNames.map(n => ({ n, tot: daily.reduce((a, d) => a + dur(d, n), 0) })).filter(r => r.tot > 0).sort((a, b) => b.tot - a.tot);
  const top = ranked.slice(0, VOL_TOP_N), rest = ranked.slice(VOL_TOP_N);
  const datasets = top.map((r, i) => ({ label: short(r.n), full: r.n, data: daily.map(d => dur(d, r.n)), backgroundColor: VOL_COLORS[i % VOL_COLORS.length], borderColor: '#fff', borderWidth: 0.5 }));
  if (rest.length) datasets.push({ label: `Lainnya (${rest.length} job)`, full: rest.map(r => r.n).join(', '), data: daily.map(d => rest.reduce((a, r) => a + dur(d, r.n), 0)), backgroundColor: '#cbd5e1', borderColor: '#fff', borderWidth: 0.5 });
  mkChart(canvasId, {
    type: 'bar',
    data: { labels: daily.map(d => fmtDateShort(d.date)), datasets },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ...gridXAllDates, stacked: true }, y: { ...gridY, stacked: true, ticks: { callback: v => v >= 120 ? Math.round(v / 60) + 'j' : v + 'm' } } },
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, boxHeight: 12, padding: 12, font: { size: 11 } } },
        tooltip: { itemSort: (a, b) => b.raw - a.raw, filter: it => it.raw > 0,
          callbacks: { label: c => c.dataset.label + ': ' + fmtHm(c.raw), footer: items => 'Total: ' + fmtHm(items.reduce((a, i) => a + i.raw, 0)) } } } },
  });
}
/* SOD -- durasi dipecah: tunggu scheduler vs eksekusi, hari "selesai tanpa started", jeda EOD->SOD */
function fmtClockMin(m) { if (m == null) return '—'; const t = Math.round(m); return String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function fmtGap(m) { if (m == null) return '—'; return (m < 0 ? 'sebelum EOD selesai ' : 'setelah EOD selesai ') + fmtHm(Math.abs(m)); }
function fmtHm(m) { if (m == null) return '—'; const t = Math.round(m); return Math.floor(t / 60) + 'j ' + (t % 60) + 'm'; }
function sodSchedHtml(sod) {

    + kpiCard('activity', 'SOD Mulai Sebelum EOD Selesai', sc.overlapDays, ' / ' + sc.gapDays + ' hari', 'neutral')
    + kpiCard('disk', 'Eksekusi Lambat', sc.slowRuns, ' run', sc.slowRuns === 0 ? 'green' : 'yellow')

    + `</tbody></table></div><div class="note" style="margin-top:8px">SOD dihitung mulai dari log job SOD pertama; jika lebih awal dari akhir rantai EOD, berarti SOD berjalan tumpang tindih dengan ekor EOD. &ldquo;Tanpa Started&rdquo; = job kembali ke status <i>holding</i> dalam masa tunggu scheduler tanpa pernah <i>started</i> (selesai sangat cepat, &lt;1 menit). Eksekusi lambat = &gt; ${sc.slowFactor}&times; median job itu sendiri.</div></div>`;

/* ============ CYCLIC JOB -- berbasis EKSEKUSI (cyclic_runs_*.csv), layout mengikuti cyclic_report_*.html ============ */
const CYC_GROUP_COLORS = ['#7c3aed', '#0d9488', '#2563eb', '#f59e0b', '#db2777', '#546e7a'];

// Warna per keluarga job (satu hue per keluarga, shade berbeda per job) -- mudah dibedakan & berkaitan secara logis
const CYC_FAMILIES = [
  { re: /^daily_ods_/, colors: ['#1d4ed8', '#3b82f6', '#60a5fa', '#93c5fd'] },
  { re: /^daily_sinvest_sid_/, colors: ['#c2410c', '#f59e0b'] },
  { re: /^intraday_/, colors: ['#7c3aed'] },
  { re: /^daily_sinvest_kyc_/, colors: ['#166534', '#16a34a', '#4ade80', '#bbf7d0'] },
  { re: /^daily_sinvest_ifu_/, colors: ['#9d174d', '#ec4899'] },
];
function cycJobColors(names) {
  const used = {}, out = {};
  names.forEach(n => {
    const f = CYC_FAMILIES.find(x => x.re.test(n));
    if (!f) { out[n] = '#94a3b8'; return; }
    used[f.re] = (used[f.re] || 0);
    out[n] = f.colors[used[f.re] % f.colors.length];
    used[f.re]++;
  });
  return out;
}
function cycPill(text, kind) {
  const cls = { ok: 'b-ok', bad: 'b-bad', warn: 'b-warn', info: 'b-info', mut: 'b-mut' }[kind] || 'b-mut';
  return `<span class="badge ${cls}">${text}</span>`;
}
function cycDur(sec) {
  if (sec == null) return '&mdash;';
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m >= 60 ? Math.floor(m / 60) + 'j ' + (m % 60) + 'm' : m + 'm' + (s ? ' ' + String(s).padStart(2, '0') + 's' : '');
}
function cycBar(pct, color) {
  return `<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:60px;height:6px;background:var(--line);border-radius:3px"><div style="width:${pct}%;height:6px;border-radius:3px;background:${color}"></div></div><span class="mono" style="font-size:11px">${pct}%</span></div>`;
}
function cycSec(eyebrow, title, hint) {
  return `<div class="sec-head"><span class="eyebrow">${eyebrow}</span><h2>${title}</h2>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
}
function cycTable(head, rows, emptyMsg) {
  if (!rows.length) return `<div class="card"><div class="note">${emptyMsg}</div></div>`;
  return `<div class="card"><div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
}

  h += cycSec('Volume', 'Volume Eksekusi per Hari', 'success / tanpa file / failed');
  h += `<div class="card">${chartScrollWrap('cycDaily', 260, c.daily.length)}</div>`;

  // 4. Ringkasan per job (jadwal, run, durasi)
  h += cycSec('Detail', 'Ringkasan per Job', 'jadwal, eksekusi, dan durasi per eksekusi');
  h += cycTable(
    '<th>Job</th><th>Jadwal</th><th class="n">Run</th><th class="n">Run/Hari</th><th class="n">Success</th><th class="n">Tanpa File</th><th class="n">Failed</th><th class="n">Med</th><th class="n">P95</th><th class="n">Max</th>',
    c.jobs.map(j => `<tr><td>${code(j.name)}</td><td style="font-size:11.5px;color:var(--txt2)">${j.schedule.label}</td>
      <td class="n">${fmtN(j.runs)}</td><td class="n">${j.runs ? j.perDayMin + '&ndash;' + j.perDayMax : '&mdash;'}</td><td class="n">${fmtN(j.success)}</td><td class="n">${fmtN(j.noFile)}</td>
      <td class="n" style="color:${j.failed ? 'var(--red)' : 'inherit'}">${j.failed}</td><td class="n">${cycDur(j.durMedSec)}</td><td class="n">${cycDur(j.durP95Sec)}</td><td class="n">${cycDur(j.durMaxSec)}</td></tr>`),
    'Tidak ada data job.');

  // 5. Job gagal
  h += cycSec('Perhatian', 'Job Gagal', 'eksekusi yang berakhir "Job failed" bukan karena tidak ada file');
  h += cycTable('<th>Tanggal</th><th>Jam</th><th>Job</th><th class="n">Error Code</th><th class="n">Durasi</th><th>Status</th>',
    c.failedRuns.map(r => `<tr><td class="mono">${r.date}</td><td class="mono">${r.time}</td><td>${code(r.job)}</td><td class="n">${r.errorCode || '&mdash;'}</td><td class="n">${cycDur(r.durationSec)}</td><td>${cycPill(r.result, 'bad')}</td></tr>`),
    'Tidak ada eksekusi gagal pada periode ini.');

  // 6. Missed run detection (job terjadwal)
  const sched = c.jobs.filter(j => j.schedule.type === 'scheduled');
  h += cycSec('Deteksi', 'Missed Run Detection', 'jadwal ekspektasi vs eksekusi aktual (job terjadwal)');
  h += cycTable('<th>Job</th><th>Jadwal</th><th class="n">Ekspektasi</th><th class="n">Aktual</th><th class="n">Missed</th><th class="n">Run Tambahan</th><th>Status</th>',
    sched.map(j => `<tr><td>${code(j.name)}</td><td style="font-size:11.5px;color:var(--txt2)">${j.schedule.label}</td><td class="n">${fmtN(j.expected)}</td><td class="n">${fmtN(j.runs)}</td>
      <td class="n" style="color:${j.missed ? 'var(--red)' : 'inherit'}">${j.missed}</td><td class="n">${j.extra}</td><td>${j.missed ? cycPill('MISSED', 'bad') : cycPill('SESUAI JADWAL', 'ok')}</td></tr>`),
    'Tidak ada job terjadwal.');

  // 7. Anomali runtime
  h += cycSec('Anomali', 'Anomali Runtime', `durasi eksekusi &gt; ${c.slowFactor}&times; median job itu sendiri`);
  h += cycTable('<th>Tanggal</th><th>Jam</th><th>Job</th><th class="n">Durasi</th><th class="n">Median</th><th class="n">Rasio</th>',
    c.slowRuns.map(a => `<tr><td class="mono">${a.date}</td><td class="mono">${a.time}</td><td>${code(a.job)}</td><td class="n">${cycDur(a.durationSec)}</td><td class="n">${cycDur(a.medianSec)}</td><td class="n">${cycPill(a.ratio + '&times;', a.ratio >= 10 ? 'bad' : 'warn')}</td></tr>`),
    'Tidak ada eksekusi dengan durasi abnormal.');

  // 8. Gap analysis
  h += cycSec('Interval', 'Gap Analysis &mdash; Interval Abnormal', `jarak antar-eksekusi &gt; ${c.gapFactor}&times; median (job event-driven yang polling tiap jam)`);
  h += cycTable('<th>Tanggal</th><th>Job</th><th class="n">Run Sebelum</th><th class="n">Run Berikut</th><th class="n">Gap</th><th class="n">Normal</th>',
    c.gaps.map(g => `<tr><td class="mono">${g.date}</td><td>${code(g.job)}</td><td class="n mono">${g.from}</td><td class="n mono">${g.to}</td><td class="n">${cycPill(g.gapMin + ' mnt', g.gapMin >= 180 ? 'bad' : 'warn')}</td><td class="n">${g.baseMin} mnt</td></tr>`),
    'Tidak ada gap antar-eksekusi yang abnormal.');
  h += `<div class="note" style="margin:-4px 0 16px">Gap pada job event-driven umumnya berarti tidak ada file masuk pada jam itu, bukan job yang mati.</div>`;

  // 9. Throughput file
  h += cycSec('Throughput', 'Throughput File', 'file yang diproses (upload ke Avaloq) dan dikirim (download/outbound) per hari');
  h += `<div class="card">${chartScrollWrap('cycFiles', 240, c.daily.length)}</div>`;
  h += cycTable('<th>Job</th><th class="n">File Digenerate</th><th class="n">File Dikirim</th><th class="n">File Diproses</th>',
    c.jobs.filter(j => j.filesGenerated || j.filesMoved || j.filesProcessed).map(j => `<tr><td>${code(j.name)}</td><td class="n">${fmtN(j.filesGenerated)}</td><td class="n">${fmtN(j.filesMoved)}</td><td class="n">${fmtN(j.filesProcessed)}</td></tr>`),
    'Tidak ada data file.');

  // 10. Kualitas data per record
  h += cycSec('Kualitas Data', 'Gagal per Record', 'baris "Failed~&lt;alasan&gt;" di log upload (bukan kegagalan job)');
  h += cycTable('<th>Job</th><th>Alasan</th><th class="n">Jumlah</th>',
    c.recordFailReasons.map(r => `<tr><td>${code(r.job)}</td><td>${r.reason}</td><td class="n">${fmtN(r.count)}</td></tr>`),
    'Tidak ada baris gagal per record.');

  // 11. Event-driven / tidak aktif
  const ev = c.jobs.filter(j => j.schedule.type === 'event');
  h += cycSec('Aktivitas', 'Job Event-Driven', 'job yang hanya berjalan bila ada file masuk');
  h += cycTable('<th>Job</th><th class="n">Hari Aktif</th><th class="n">Total Run</th><th>Status</th>',
    ev.map(j => `<tr><td>${code(j.name)}</td><td class="n">${j.days} / ${c.kpi.days}</td><td class="n">${fmtN(j.runs)}</td>
      <td>${j.runs ? cycPill('AKTIF', 'ok') : cycPill('TIDAK ADA LOG', 'bad')}</td></tr>`),
    'Tidak ada job event-driven.');

  // 12. Kalender run per job
  h += cycSec('Kalender', 'Jumlah Eksekusi Harian per Job', 'angka = jumlah run &middot; abu-abu = tidak ada run');
  h += `<div class="card" style="padding:0"><div class="scroll-tbl tw" style="max-height:520px"><table><thead><tr><th>Job</th><th>Tanggal &rarr;</th></tr></thead><tbody>`;
  c.jobs.forEach(j => {
    h += `<tr><td style="white-space:nowrap">${code(j.name)}</td><td><div class="calcells">${j.daily.map((n, i) =>
      `<div class="calcell ${n ? 'g' : 'n'}" title="${c.dates[i]} &middot; ${n} run">${n || ''}</div>`).join('')}</div></td></tr>`;
  });
  h += `</tbody></table></div></div>`;

  document.getElementById('p-opjob').innerHTML = h;

  const jobColor = cycJobColors(c.jobs.filter(j => j.runs).map(j => j.name));
  mkChart('cycHourly', {
    type: 'bar',
    data: { labels: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00'),
      datasets: c.jobs.filter(j => j.runs).map(j => ({ label: j.name, data: j.hours, backgroundColor: jobColor[j.name], borderColor: '#fff', borderWidth: 0.5 })) },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ...gridXAllDates, stacked: true }, y: { ...gridY, stacked: true, ticks: { precision: 0 } } },
      plugins: { legend: { position: 'right', labels: { boxWidth: 10, boxHeight: 10, padding: 8, font: { size: 10 } } } } },
  });
  mkChart('cycDaily', {
    type: 'bar',
    data: { labels: c.daily.map(d => fmtDateShort(d.date)), datasets: [
      { label: 'Success', data: c.daily.map(d => d.S), backgroundColor: '#16a34a' },
      { label: 'Tanpa File', data: c.daily.map(d => d.N), backgroundColor: '#cbd5e1' },
      { label: 'Failed', data: c.daily.map(d => d.F), backgroundColor: '#dc2626' },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ...gridXAllDates, stacked: true }, y: { ...gridY, stacked: true, ticks: { precision: 0 } } },
      plugins: { legend: { position: 'top' } } },
  });
  mkChart('cycFiles', {
    type: 'bar',
    data: { labels: c.daily.map(d => fmtDateShort(d.date)), datasets: [
      { label: 'File diproses', data: c.daily.map(d => d.files_in), backgroundColor: '#2563eb' },
      { label: 'File dikirim', data: c.daily.map(d => d.files_out), backgroundColor: '#0d9488' },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: gridXAllDates, y: { ...gridY, ticks: { precision: 0 } } },
      plugins: { legend: { position: 'top' } } },
  });
}

/* ----- Execution Time Each Job: RENDERER (tabel dual-sticky, warna absolut sesuai
   threshold thresholds.py -- Ideal/Normal/Warning/Critical, BUKAN relatif per job) ----- */
function renderExecutionTimeEachJob(data) {
  if (!data || !data.jobs || !data.jobs.length) return '';
  const dates = data.dates;
  let h = `<div class="sec-head"><span class="eyebrow">Detail</span><h2>Execution Time Each Job</h2><span class="hint">${data.jobs.length} job &times; ${dates.length} hari &middot; ms/record &middot; &#128994;Ideal &#128309;Normal &#128993;Warning &#128997;Critical</span></div>`;
  h += `<div class="card" style="padding:0"><div class="scroll-tbl tw" style="max-height:520px"><table class="detail-tbl"><thead>
    <tr><th class="datecell" rowspan="2">Job</th><th class="grp" colspan="${dates.length}">Date</th></tr>
    <tr>${dates.map(d => `<th class="n">${d.slice(8, 10)}</th>`).join('')}</tr>
  </thead><tbody>`;
  data.jobs.forEach(job => {
    h += `<tr><td class="datecell" style="font-weight:700;text-align:left">${job.jobName}</td>`;
    job.values.forEach((val, i) => {
      const status = job.statuses[i]; const date = dates[i];
      const tip = `Job: ${job.jobName} | Tanggal: ${date} | ET: ${val != null ? val + ' ms/record' : 'N/A'} | Status: ${status}`;
      if (status === 'FAILED') {
        h += `<td class="n" title="${tip}"><span class="badge b-bad" style="font-size:10px;padding:2px 6px">FAILED</span></td>`;
      } else if (val == null) {
        h += `<td class="n" title="${tip}"><span class="vbadge na">N/A</span></td>`;
      } else {
        const cls = VBADGE_CLASS[status.toLowerCase()] || 'g';
        h += `<td class="n" title="${tip}"><span class="vbadge ${cls}">${val}</span></td>`;
      }
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div></div>`;
  return h;
}
function executionTimeSummaryTable(list, opts) {
  if (!list || !list.length) return '';
  opts = opts || {};
  let h = '';
  if (opts.searchId) {
    h += `<div class="filterbar" style="margin-bottom:10px"><div class="fitem"><label>Job Name</label><input type="text" id="${opts.searchId}" placeholder="Cari nama job..."></div></div>`;
  }
  h += `<div class="card"><div class="tw"><table${opts.tableId ? ` id="${opts.tableId}"` : ''}><thead><tr><th>Job Name</th><th class="n">MED ET</th><th class="n">P95 ET</th><th class="n">Max ET</th><th>Note</th></tr></thead><tbody>`;
  list.forEach(r => {
    const na = r.medET == null;
    h += `<tr data-jobname="${(r.jobName || '').toLowerCase()}"><td>${r.jobName}</td>
      <td class="n">${na ? '<span class="vbadge na">N/A</span>' : r.medET + ' ms'}</td>
      <td class="n">${na ? '<span class="vbadge na">N/A</span>' : r.p95ET + ' ms'}</td>
      <td class="n">${na ? '<span class="vbadge na">N/A</span>' : r.maxET + ' ms'}</td>
      <td style="color:var(--txt2);font-size:12px">${r.note}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  return h;
}
function wireExecutionTimeSearch(searchId, tableId) {
  const input = document.getElementById(searchId);
  const table = document.getElementById(tableId);
  if (!input || !table) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    table.querySelectorAll('tbody tr').forEach(tr => {
      tr.style.display = tr.dataset.jobname.includes(q) ? '' : 'none';
    });
  });
}


/* ============ TRANSACTION -- dual selector (Business Process + Metric), kolom dinamis per process ============ */
let trxSel = {}; // {sectionKey: {process, metric}}
const trxNaOrRp = v => (v == null) ? '<span style="color:var(--txt3)">N/A</span>' : 'Rp ' + fmtRp(v);

function trxSectionHtml(opts) {
  // opts: {key, eyebrow, title, hint, dataArr, useFullDates}
  if (!trxSel[opts.key]) trxSel[opts.key] = { process: opts.dataArr[0].process, metric: 'record' };
  const sel = trxSel[opts.key];
  const procMeta = D.transaction.summary.find(s => s.process === sel.process);
  const canAmount = procMeta ? procMeta.hasAmount : true;
  const nPoints = opts.dataArr[0].points.length;

  let h = `<div class="sec-head"><span class="eyebrow">${opts.eyebrow}</span><h2>${opts.title}</h2><span class="hint">${opts.hint}</span></div>`;
  h += `<div class="card trend-card">`;
  h += `<div class="hostsel" data-trxsel="${opts.key}" data-kind="process">` + opts.dataArr.map(p => `<button class="${p.process === sel.process ? 'on' : ''}" data-val="${p.process}">${p.process}</button>`).join('') + `</div>`;
  h += `<div class="hostsel metric-sel" data-trxsel="${opts.key}" data-kind="metric" style="margin-top:8px">
    <button class="${sel.metric === 'record' ? 'on' : ''} m-record" data-val="record">Record</button>
    <button class="${sel.metric === 'amount' ? 'on' : ''} m-amount" data-val="amount" ${canAmount ? '' : 'disabled'}>Amount${canAmount ? '' : ' (N/A)'}</button>
  </div>`;
  h += `<div class="chart" style="height:250px;position:relative;margin-top:10px" id="trxwrap_${opts.key}">`
    + (opts.useFullDates ? chartScrollWrap('trx_' + opts.key, 250, nPoints) : `<div class="chart" style="height:250px"><canvas id="trx_${opts.key}"></canvas></div>`)
    + `<div class="fs-na" id="trxna_${opts.key}" style="display:none;position:absolute;inset:0;background:var(--panel)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>Amount tidak tersedia untuk ${sel.process}.</div>
        <div class="fs-na-sub">Business process ini tidak memiliki data nominal transaksi.</div>
      </div></div></div>`;
  return h;
}
function drawTrxChart(key, useFullDates) {
  const sel = trxSel[key];
  const dataArr = D.transaction.businessProcessTrend;
  const series = dataArr.find(p => p.process === sel.process);
  const canvasEl = document.getElementById('trx_' + key);
  const naEl = document.getElementById('trxna_' + key);
  const successKey = sel.metric === 'record' ? 'successRecord' : 'successAmount';
  const errorKey = sel.metric === 'record' ? 'errorRecord' : 'errorAmount';
  const hasData = series.points.some(p => p[successKey] != null);
  if (!hasData) {
    if (charts['trx_' + key]) { charts['trx_' + key].destroy(); delete charts['trx_' + key]; }
    if (canvasEl) canvasEl.style.display = 'none';
    if (naEl) naEl.style.display = 'flex';
    return;
  }
  if (canvasEl) canvasEl.style.display = 'block';
  if (naEl) naEl.style.display = 'none';
  const labels = series.points.map(p => fmtDateShort(p.date));
  const unit = sel.metric === 'amount' ? ' (Rp)' : '';
  mkChart('trx_' + key, {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Complete Order', data: series.points.map(p => p[successKey]), backgroundColor: '#16a34a', borderRadius: 2 },
      { label: 'Discarded', data: series.points.map(p => p[errorKey]), backgroundColor: '#dc2626', borderRadius: 2 },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: gridXAllDates, y: { ...gridY, ticks: { callback: v => sel.metric === 'amount' ? fmtRp(v) : fmtN(v) } } },
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (sel.metric === 'amount' ? 'Rp ' + fmtRp(c.raw) : fmtN(c.raw) + unit) } } } },
  });
}
function wireTrxSelectors(key, useFullDates) {
  document.querySelectorAll(`.hostsel[data-trxsel="${key}"]`).forEach(bar => {
    bar.addEventListener('click', e => {
      const btn = e.target.closest('button[data-val]');
      if (!btn || btn.disabled) return;
      const kind = bar.dataset.kind;
      trxSel[key][kind] = btn.dataset.val;
      bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      if (kind === 'process') {
        const procMeta = D.transaction.summary.find(s => s.process === btn.dataset.val) || { hasAmount: true };
        const metricBar = document.querySelector(`.hostsel.metric-sel[data-trxsel="${key}"]`);
        const amtBtn = metricBar.querySelector('.m-amount');
        amtBtn.disabled = !procMeta.hasAmount;
        amtBtn.textContent = procMeta.hasAmount ? 'Amount' : 'Amount (N/A)';
        if (!procMeta.hasAmount && trxSel[key].metric === 'amount') {
          trxSel[key].metric = 'record';
          metricBar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === 'record'));
        }
      }
      drawTrxChart(key, useFullDates);
    });
  });
}

/* ============ Transaction -- Reksadana (mf_trx.py: master mx stex transaction date.xlsx) ============ */
function mfTrxHtml() {
  const m = D.mfTrx;
  if (!m || !m.kpi) return '';
  const k = m.kpi, rp = v => 'Rp ' + fmtRp(v), flow = v => `<span style="color:${v < 0 ? 'var(--red)' : 'var(--green, #16a34a)'}">${v < 0 ? '-' : '+'}${rp(Math.abs(v))}</span>`;
  let h = cycSec('Reksadana', 'Transaksi Reksadana', `${m.meta.period} &middot; ${m.meta.days} hari bursa &middot; ${fmtN(k.total)} transaksi`);

  h += `<div class="kpi-row k4">`
    + kpiCard('server', 'Total Transaksi', fmtN(k.total), '', 'neutral')
    + kpiCard('cpu', 'Total Nominal', rp(k.totalValue), '', 'neutral')
    + kpiCard('activity', 'Nasabah Unik (Complete Order)', fmtN(k.uniqueCif), '', 'neutral')
    + kpiCard('disk', 'Total Fee (IDR)', rp(k.fee), '', 'neutral')
    + kpiCard('memory', 'Subscription', rp(k.sub), '', 'neutral')
    + kpiCard('peak', 'Redemption', rp(k.red), '', 'neutral')
    + kpiCard('activity', 'Net Flow', (k.net < 0 ? '-' : '+') + rp(Math.abs(k.net)), '', k.net < 0 ? 'red' : 'green')
    + kpiCard('peak', 'Nilai Switching', rp(k.switchValue), '', 'neutral')
    + `</div>`;

  // Insight otomatis
  const ch = m.channel.slice().sort((a, b) => b.discardRate - a.discardRate)[0];
  const dt = m.discardByType[0], big = m.biggest[0], f0 = m.funds[0], cat = m.category.slice().sort((a, b) => a.net - b.net)[0];
  const ins = [
    `Net flow bulan ini <b>${k.net < 0 ? 'negatif (outflow)' : 'positif (inflow)'} ${rp(Math.abs(k.net))}</b>: subscription ${rp(k.sub)} vs redemption ${rp(k.red)}.`,
    (() => { const mb = m.channel.find(x => x.name === 'Mobile Banking'), tv = m.channel.reduce((a, x) => a + x.sub + x.red, 0), tc = m.channel.reduce((a, x) => a + x.count, 0);
      return mb && tv && tc ? `<b>Mobile Banking</b> = ${(mb.count / tc * 100).toFixed(1)}% transaksi tetapi ${((mb.sub + mb.red) / tv * 100).toFixed(1)}% nilai (subscription + redemption).` : ''; })(),
    f0 ? `<b>${f0.name}</b> mendominasi: ${m.meta.topFundShare}% dari total nilai subscription + redemption.` : '',
    cat && cat.net < 0 ? `Outflow terbesar di kategori <b>${cat.name}</b> (net -${rp(Math.abs(cat.net))}).` : '',
    dt ? `Discard tertinggi pada <b>${dt.type}</b>: ${fmtN(dt.count)} transaksi (${dt.rate}% dari tipe tsb).` : '',
    ch ? `Channel <b>${ch.name}</b> punya discard rate tertinggi: ${ch.discardRate}%.` : '',
    big ? `Transaksi tunggal terbesar: ${big.type} ${rp(big.amount)} (${big.fund}, ${big.channel}, ${big.date}).` : '',
    `Complete rate seluruh transaksi <b>${k.doneRate}%</b> (${fmtN(k.done)} dari ${fmtN(k.total)}).`,
    k.usdCount ? `${fmtN(k.usdCount - (k.usdNoRate || 0))} dari ${fmtN(k.usdCount)} transaksi USD (Complete Order) dikonversi ke IDR dengan kurs harian turunan data (${fmtN(k.fxDays)} tanggal, ${fmtN(k.fxMin)} &ndash; ${fmtN(k.fxMax)}), total ${rp(k.usdValue)}.` : '',
    k.usdNoRate ? `${fmtN(k.usdNoRate)} transaksi USD (Complete Order) jatuh di tanggal tanpa kurs di data, sehingga <b>tidak masuk</b> nilai IDR.` : '',
  ].filter(Boolean);
  h += `<div class="card"><ul style="margin:0;padding:4px 20px;line-height:1.9;font-size:13px">${ins.map(x => `<li>${x}</li>`).join('')}</ul></div>`;

  h += cycSec('Arus Dana', 'Subscription vs Redemption per Hari', 'batang = nilai (Rp) &middot; garis kuning = net flow harian &middot; garis ungu putus-putus = net flow kumulatif (sumbu kanan) &middot; hanya Complete Order');
  h += `<div class="card">${chartScrollWrap('mfDaily', 320, m.daily.length)}</div>`;

  if (m.regular && m.regular.length) {

let trxDetailTab = null, trxDetailPanes = [];
function trxDetailTabsHtml() {
  const b = D.bondTrx || {};
  trxDetailPanes = [
